{{define "new_vm_page"}}
<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
  <h1>Apiary</h1>
  {{template "nav" .}}
  <h2>New VM</h2>
  <form class="create-vm" hx-post="/vms" hx-target="#create-error" hx-swap="innerHTML">
    <label>ID <input type="text" name="id" required></label>
    <label>Name <input type="text" name="name"></label>
    <label>vCPUs <input type="number" name="vcpus" value="1" min="1"></label>
    <label>Memory (MB) <input type="number" name="memory_mb" value="512" min="1"></label>
    <label>Node ID
      {{if .Nodes}}
      <select name="node_id">
        {{range .Nodes}}<option value="{{.}}">{{.}}</option>{{end}}
      </select>
      {{else}}
      <input type="text" name="node_id">
      {{end}}
    </label>
    <label>Desired state
      <select name="desired_state">
        <option value="stopped">stopped</option>
        <option value="running">running</option>
      </select>
    </label>
    <label>ISO
      <select name="iso_name">
        <option value="">(none)</option>
        {{range .ISOs}}<option value="{{.Name}}">{{.Name}}</option>{{end}}
      </select>
    </label>
    <button type="submit">Create</button>
  </form>
  <div id="create-error" class="error"></div>
</body>
</html>
{{end}}
