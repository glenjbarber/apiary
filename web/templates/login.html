{{define "login_page"}}
<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
  <h1>Apiary</h1>
  <h2>Log in</h2>
  <form method="post" action="/login" class="create-vm">
    <label>Username <input type="text" name="username" required autofocus></label>
    <label>Password <input type="password" name="password" required></label>
    {{if .NextURL}}<input type="hidden" name="next" value="{{.NextURL}}">{{end}}
    <button type="submit">Log in</button>
  </form>
  <div class="error">{{.LoginError}}</div>
</body>
</html>
{{end}}
