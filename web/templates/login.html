{{define "login_page"}}
<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body class="login-layout">
  <main class="login-panel">
    <a class="brand login-brand" href="/" aria-label="Apiary home"><img class="brand-logo" src="/static/apiary-mark.svg" alt=""><span class="brand-name">APIARY</span></a>
    <h1>Log in</h1>
    <div class="muted">Manage the Apiary Colony.</div>
    <form method="post" action="/login" class="create-vm inline-form">
      <label>Username <input type="text" name="username" required autofocus></label>
      <label>Password <input type="password" name="password" required></label>
      {{if .NextURL}}<input type="hidden" name="next" value="{{.NextURL}}">{{end}}
      <button type="submit">Log in</button>
    </form>
    <div class="error">{{.LoginError}}</div>
  </main>
</body>
</html>
{{end}}
