{{define "vm_rows"}}
{{if .Error}}<tr><td colspan="8" class="error">{{.Error}}</td></tr>{{end}}
{{range .VMs}}
<tr>
  <td>{{.ID}}</td>
  <td>{{.Name}}</td>
  <td>{{.VCPUs}}</td>
  <td>{{.MemoryMB}}</td>
  <td>{{.NodeID}}</td>
  <td{{if eq .Phase "error"}} title="{{.PhaseError}}"{{end}}>{{.Phase}}</td>
  <td>{{if .IPAddress}}{{.IPAddress}}{{end}}</td>
  <td>
    <a href="/vms/{{.ID}}/console">Console</a>
    <button hx-delete="/vms/{{.ID}}" hx-target="#vm-rows" hx-swap="innerHTML" hx-confirm="Delete {{.ID}}?">Delete</button>
  </td>
</tr>
{{else}}
  {{if not .Error}}<tr><td colspan="8"><em>No VMs</em></td></tr>{{end}}
{{end}}
{{end}}
