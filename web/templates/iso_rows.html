{{define "iso_rows"}}
{{if .Error}}<tr><td colspan="4" class="error">{{.Error}}</td></tr>{{end}}
{{range .ISOs}}
<tr>
  <td>{{.Name}}</td>
  <td>{{.Size}}</td>
  <td><code title="{{.SHA256}}">{{.SHA256Short}}</code> <button type="button" class="icon-button" data-copy="{{.SHA256}}" title="Copy full SHA-256" aria-label="Copy full SHA-256 for {{.Name}}">Copy</button></td>
  <td>
    {{if $.CanOperate}}<button class="danger" hx-delete="/isos/{{.Name}}" hx-target="#iso-panel" hx-swap="innerHTML" hx-confirm="Delete {{.Name}}?">Delete</button>{{end}}
  </td>
</tr>
{{else}}
  {{if not .Error}}<tr><td colspan="4"><em>No images</em></td></tr>{{end}}
{{end}}
{{end}}
