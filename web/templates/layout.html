{{define "head"}}
<head>
  <meta charset="utf-8">
  <title>Apiary</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    nav { margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #333; }
    nav a.active { font-weight: bold; text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    form.create-vm, form.upload-iso { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; }
    form.create-vm label, form.upload-iso label { display: flex; flex-direction: column; font-size: 0.85rem; }
    .error { color: #b00020; }
    .success { color: #1b5e20; }
    /* Fixed height so an appearing/disappearing message doesn't shift
       the table below it up and down; padding/background/border only
       kick in once there's actual text, via :not(:empty), so the
       reserved space stays a plain sliver when there's nothing to show. */
    #create-error, #iso-error, #iso-success {
      min-height: 1.25em; margin-top: 0.5rem; font-size: 0.9em;
      word-break: break-word;
    }
    #create-error:not(:empty), #iso-error:not(:empty) {
      background: #fdecea; border: 1px solid #f5c6c0; border-radius: 4px;
      padding: 0.5rem 0.75rem;
    }
    #iso-success:not(:empty) {
      background: #eaf7ec; border: 1px solid #c2e6c6; border-radius: 4px;
      padding: 0.5rem 0.75rem;
    }
    code { font-size: 0.8em; word-break: break-all; }
    .upload-progress { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
    .upload-progress progress { flex: 1; max-width: 20rem; height: 1rem; }
    .upload-progress span { font-size: 0.85em; min-width: 3em; }
    /* Must come after .upload-progress so it wins on equal specificity -
       otherwise the class rule's own "display: flex" would override the
       browser's default [hidden] handling and the bar would never
       actually hide between uploads. */
    .upload-progress[hidden] { display: none; }
  </style>
</head>
{{end}}

{{define "nav"}}
<nav>
  <a href="/"{{if eq .ActivePage "stats"}} class="active"{{end}}>Stats</a>
  <a href="/vms"{{if eq .ActivePage "vms"}} class="active"{{end}}>VMs</a>
  <a href="/images"{{if eq .ActivePage "images"}} class="active"{{end}}>Images</a>
  <a href="/networks"{{if eq .ActivePage "networks"}} class="active"{{end}}>Networks</a>
  <a href="/apikeys"{{if eq .ActivePage "apikeys"}} class="active"{{end}}>API Keys</a>
  <a href="/vms/new"{{if eq .ActivePage "new_vm"}} class="active"{{end}}>New VM</a>
  {{if .AuthEnabled}}
  <form method="post" action="/logout" style="display: inline;">
    <button type="submit" style="background: none; border: none; color: #333; text-decoration: underline; cursor: pointer; padding: 0; font: inherit;">Log out</button>
  </form>
  {{end}}
</nav>
{{end}}
