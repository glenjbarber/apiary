{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apiary</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    form.create-vm, form.upload-iso { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; }
    form.create-vm label, form.upload-iso label { display: flex; flex-direction: column; font-size: 0.85rem; }
    .error { color: #b00020; }
    /* Fixed height so an appearing/disappearing error doesn't shift
       the table below it up and down. */
    #create-error, #iso-error { min-height: 1.25em; margin-top: 0.5rem; }
    code { font-size: 0.8em; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Apiary</h1>
  {{template "content" .}}
</body>
</html>
{{end}}
