{{define "new_jail_page"}}
<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
  {{template "nav" .}}
  {{template "page_header" (pageHeader "Create jail" "Define a FreeBSD jail's identity and placement." "<a href='/jails'>Cancel</a>")}}
  <form class="create-vm panel" style="margin-top:1rem" hx-post="/jails" hx-target="#create-error" hx-swap="innerHTML">
    <label>ID <input type="text" name="id" required></label>
    <label>Name <input type="text" name="name"></label>
    <label>Hostname <input type="text" name="hostname"></label>
    <label>Node ID
      {{if .Nodes}}
      <select name="node_id">
        {{range .Nodes}}<option value="{{.}}">{{.}}</option>{{end}}
      </select>
      {{else}}
      <input type="text" name="node_id">
      {{end}}
    </label>
    <label>Replica node ID (optional - HAST root replication, see ADR-0026)
      <input type="text" name="replica_node_id">
    </label>
    <button type="submit">Create</button>
  </form>
  <div id="create-error" class="banner-error"></div>
</body>
</html>
{{end}}
