syntax = "proto3";

package apiary.internal.v1;

import "api/internalpb/state.proto";

option go_package = "github.com/glenjbarber/apiary/api/internalpb;internalpb";

// RaftInternal is the internal protocol spoken over the Unix domain socket
// between managerd and raftd. Apply carries an opaque, FSM-defined payload
// rather than a typed ephemeral-state schema, since the real ephemeral
// state types (VM defs, node ownership) haven't been designed yet.
service RaftInternal {
  // Apply submits a command to the raft log. It only succeeds against the
  // current leader; a non-leader node returns an error and, if known, a
  // hint pointing at the current leader.
  rpc Apply(ApplyRequest) returns (ApplyResponse);

  // Status reports this node's current raft state.
  rpc Status(StatusRequest) returns (StatusResponse);

  // AddVoter adds a new voting server to the cluster. It only succeeds
  // against the current leader. The new server must already be running
  // and reachable at address before this is called.
  rpc AddVoter(AddVoterRequest) returns (AddVoterResponse);

  // RemoveServer removes a server (voter or otherwise) from the cluster.
  // It only succeeds against the current leader.
  rpc RemoveServer(RemoveServerRequest) returns (RemoveServerResponse);

  // GetVM reads a single VM definition from this node's FSM state. Like
  // Apply, it only succeeds against the current leader - v1's read
  // consistency model is deliberately the same as its write model: the
  // leader is the sole source of truth, avoiding the complexity of
  // serving reads from potentially-lagging followers.
  rpc GetVM(GetVMRequest) returns (GetVMResponse);

  // ListVMs reads all VM definitions from this node's FSM state, subject
  // to the same leader-only requirement as GetVM.
  rpc ListVMs(ListVMsRequest) returns (ListVMsResponse);

  // GetNetwork/ListNetworks mirror GetVM/ListVMs exactly, for
  // NetworkDefinitions instead of VMDefinitions - same leader-only read
  // model, same reasoning. CreateNetwork/DeleteNetwork need no dedicated
  // RPC: they're submitted as Command variants through the existing
  // Apply, exactly like CreateVM/DeleteVM already are.
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse);
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);

  // ValidateAPIKeyHash checks a hashed API key against this node's own
  // FSM state (ADR-0023) - deliberately NOT leader-only, unlike every
  // other read RPC in this service. Raft already replicates FSM state
  // (including api_keys) onto every node, follower or leader, as they
  // replay the log; several managerd RPCs need to keep authenticating
  // callers even on a non-leader node (HostStats, GetVMConsole,
  // UploadISO are all local, per-node operations that don't otherwise
  // depend on raft leadership at all), so this can't require the
  // leader the way GetNetwork/ListNetworks do. hashed_key may be
  // empty - a caller checking only auth_enabled (used by managerd's
  // "auth never turned on yet = fully open" bootstrap check).
  rpc ValidateAPIKeyHash(ValidateAPIKeyHashRequest) returns (ValidateAPIKeyHashResponse);

  // ListAPIKeys is a normal leader-only read (mirrors ListNetworks),
  // used only for the admin-facing key list - never for per-request
  // authentication, which goes through ValidateAPIKeyHash instead.
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
}

message ApplyRequest {
  // payload is an opaque, FSM-defined command. Its encoding is not
  // interpreted by raftd itself.
  bytes payload = 1;

  // timeout_ms bounds how long to wait for the command to be committed and
  // applied. A value of 0 selects raftd's default timeout.
  uint32 timeout_ms = 2;
}

message ApplyResponse {
  // result is the opaque value returned by the FSM's Apply method.
  bytes result = 1;

  // error is set (non-empty) if the apply failed, including when this node
  // is not the current leader.
  string error = 2;

  // leader_hint is a best-effort address of the current leader, populated
  // when error indicates this node is not the leader.
  string leader_hint = 3;
}

message StatusRequest {}

message StatusResponse {
  bool is_leader = 1;
  string leader_id = 2;
  string node_id = 3;
  uint64 last_log_index = 4;
  uint64 applied_index = 5;

  // raft_state is one of "Leader", "Follower", "Candidate", or "Shutdown".
  string raft_state = 6;

  // servers lists the current cluster configuration, as known to this
  // node. Useful for verifying membership changes took effect.
  repeated ServerInfo servers = 7;
}

message ServerInfo {
  string id = 1;
  string address = 2;

  // suffrage is one of "Voter", "Nonvoter", or "Staging".
  string suffrage = 3;
}

message AddVoterRequest {
  string id = 1;
  string address = 2;

  // prev_index, if non-zero, only applies this change if the cluster
  // configuration's log index still matches it (a CAS-style guard against
  // concurrent membership changes). 0 skips the check.
  uint64 prev_index = 3;

  uint32 timeout_ms = 4;
}

message AddVoterResponse {
  string error = 1;
  string leader_hint = 2;
}

message RemoveServerRequest {
  string id = 1;
  uint64 prev_index = 2;
  uint32 timeout_ms = 3;
}

message RemoveServerResponse {
  string error = 1;
  string leader_hint = 2;
}

message GetVMRequest {
  string id = 1;
}

message GetVMResponse {
  VMDefinition vm = 1;

  // found is false if no VM with the given id exists (distinct from
  // error, which indicates the read itself couldn't be served, e.g. this
  // node isn't the leader).
  bool found = 2;

  string error = 3;
  string leader_hint = 4;
}

message ListVMsRequest {}

message ListVMsResponse {
  repeated VMDefinition vms = 1;
  string error = 2;
  string leader_hint = 3;
}

message GetNetworkRequest {
  string id = 1;
}

message GetNetworkResponse {
  NetworkDefinition network = 1;
  bool found = 2;
  string error = 3;
  string leader_hint = 4;
}

message ListNetworksRequest {}

message ListNetworksResponse {
  repeated NetworkDefinition networks = 1;
  string error = 2;
  string leader_hint = 3;
}

message ValidateAPIKeyHashRequest {
  // hashed_key may be empty - see the RPC's own doc comment.
  string hashed_key = 1;
}

message ValidateAPIKeyHashResponse {
  bool valid = 1;
  string key_id = 2;

  // auth_enabled reflects FSMSnapshotState.auth_enabled: true forever
  // once the first API key was ever created, even if every key is
  // later revoked - this is what makes revoking the last key lock the
  // cluster down rather than silently reopening it. See ADR-0023.
  bool auth_enabled = 3;

  // error is set only for a real failure reading FSM state - never
  // used to report "invalid key" or "auth not enabled yet", both of
  // which are ordinary, expected outcomes carried in valid/
  // auth_enabled above.
  string error = 4;
}

message ListAPIKeysRequest {}

message ListAPIKeysResponse {
  repeated ApiKey keys = 1;
  string error = 2;
  string leader_hint = 3;
}
