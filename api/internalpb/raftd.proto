syntax = "proto3";

package apiary.internal.v1;

import "api/internalpb/state.proto";

option go_package = "github.com/glenjbarber/apiary/api/internalpb;internalpb";

// RaftInternal is the internal protocol spoken over the Unix domain socket
// between managerd and raftd. Apply carries an opaque, FSM-defined payload
// rather than a typed ephemeral-state schema, since the real ephemeral
// state types (VM defs, node ownership) haven't been designed yet.
service RaftInternal {
  // Apply submits a command to the raft log. It only succeeds against the
  // current leader; a non-leader node returns an error and, if known, a
  // hint pointing at the current leader.
  rpc Apply(ApplyRequest) returns (ApplyResponse);

  // Status reports this node's current raft state.
  rpc Status(StatusRequest) returns (StatusResponse);

  // AddVoter adds a new voting server to the cluster. It only succeeds
  // against the current leader. The new server must already be running
  // and reachable at address before this is called.
  rpc AddVoter(AddVoterRequest) returns (AddVoterResponse);

  // RemoveServer removes a server (voter or otherwise) from the cluster.
  // It only succeeds against the current leader.
  rpc RemoveServer(RemoveServerRequest) returns (RemoveServerResponse);

  // GetVM reads a single VM definition from this node's FSM state. Like
  // Apply, it only succeeds against the current leader - v1's read
  // consistency model is deliberately the same as its write model: the
  // leader is the sole source of truth, avoiding the complexity of
  // serving reads from potentially-lagging followers.
  rpc GetVM(GetVMRequest) returns (GetVMResponse);

  // ListVMs reads all VM definitions from this node's FSM state, subject
  // to the same leader-only requirement as GetVM.
  rpc ListVMs(ListVMsRequest) returns (ListVMsResponse);

  // GetNetwork/ListNetworks mirror GetVM/ListVMs exactly, for
  // NetworkDefinitions instead of VMDefinitions - same leader-only read
  // model, same reasoning. CreateNetwork/DeleteNetwork need no dedicated
  // RPC: they're submitted as Command variants through the existing
  // Apply, exactly like CreateVM/DeleteVM already are.
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse);
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);

  // ListVMsLocal/ListNetworksLocal read the same state as ListVMs/
  // ListNetworks above, but deliberately WITHOUT the leader-only
  // restriction - see ValidateAPIKeyHash's doc comment below for the
  // exact same reasoning, applied here for the first time to plain
  // reads rather than auth. internal/cluster's Reconciler runs
  // identically on every node, leader or follower, deciding what to
  // provision locally (its own VMs, HAST replica roles, network
  // interfaces) - none of that depends on this node being the raft
  // leader, so requiring leadership here would make every non-leader
  // node's reconciler permanently unable to do its job. This was a
  // real, previously-latent gap: found live when a genuine second raft
  // node's Reconciler.RunOnce failed outright with "this node is not
  // the leader" the first time real multi-node reconciliation was
  // exercised (every deployment before this had exactly one node,
  // always the leader, so ListVMs/ListNetworks's leader restriction
  // never actually mattered) - see ADR-0025. ListVMs/ListNetworks
  // themselves stay leader-only, unchanged, for external API reads
  // (GetVM/ListVMs on ManagerService) - only the reconciler's own
  // internal use is affected.
  rpc ListVMsLocal(ListVMsRequest) returns (ListVMsResponse);
  rpc ListNetworksLocal(ListNetworksRequest) returns (ListNetworksResponse);

  // ValidateAPIKeyHash checks a hashed API key against this node's own
  // FSM state (ADR-0023) - deliberately NOT leader-only, unlike every
  // other read RPC in this service. Raft already replicates FSM state
  // (including api_keys) onto every node, follower or leader, as they
  // replay the log; several managerd RPCs need to keep authenticating
  // callers even on a non-leader node (HostStats, GetVMConsole,
  // UploadISO are all local, per-node operations that don't otherwise
  // depend on raft leadership at all), so this can't require the
  // leader the way GetNetwork/ListNetworks do. hashed_key may be
  // empty - a caller checking only auth_enabled (used by managerd's
  // "auth never turned on yet = fully open" bootstrap check).
  rpc ValidateAPIKeyHash(ValidateAPIKeyHashRequest) returns (ValidateAPIKeyHashResponse);

  // ListAPIKeys is a normal leader-only read (mirrors ListNetworks),
  // used only for the admin-facing key list - never for per-request
  // authentication, which goes through ValidateAPIKeyHash instead.
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);

  // GetJail/ListJails mirror GetNetwork/ListNetworks exactly, for
  // jail orchestration (ADR-0026's second half).
  rpc GetJail(GetJailRequest) returns (GetJailResponse);
  rpc ListJails(ListJailsRequest) returns (ListJailsResponse);

  // ListJailsLocal mirrors ListVMsLocal/ListNetworksLocal above -
  // internal/cluster's Reconciler needs to read jail state on every
  // node, leader or not, for the exact same reason it needs
  // ListVMsLocal/ListNetworksLocal.
  rpc ListJailsLocal(ListJailsRequest) returns (ListJailsResponse);

  // ExportState returns this node's current, live FSM state as of the
  // moment of the call - not a periodic on-disk raft snapshot, since
  // raft.DefaultConfig's SnapshotInterval/SnapshotThreshold mean the
  // on-disk snapshot store can be arbitrarily stale (or empty) on a
  // lightly-loaded cluster. Leader-only, like ListAPIKeys - a
  // deliberate, occasional admin action gets the strongest
  // consistency guarantee available, not the *Local reasoning used
  // for hot-path reconciler reads above. Used by raftd's own -export
  // CLI mode (docs/adr/0051-raftd-config-save-restore.md), not
  // exposed through managerd/ManagerService.
  rpc ExportState(ExportStateRequest) returns (ExportStateResponse);

  // GetPendingJoinRequestLocal/ListPendingJoinRequestsLocal back the
  // mutually-authorized Colony-join flow (ADR-0083) - deliberately
  // WITHOUT the leader-only restriction, the same ListVMsLocal/
  // ListNetworksLocal reasoning above: a joining Comb polls whichever
  // specific existing member it originally contacted, which may not be
  // (or may no longer be) the leader, and raft has already replicated
  // the record onto it regardless.
  rpc GetPendingJoinRequestLocal(GetPendingJoinRequestRequest) returns (GetPendingJoinRequestResponse);
  rpc ListPendingJoinRequestsLocal(ListPendingJoinRequestsRequest) returns (ListPendingJoinRequestsResponse);

  // GetRestartLeaseStateLocal backs the action-preflight restart
  // guardrail (ADR-0103) - deliberately WITHOUT the leader-only
  // restriction, the same GetPendingJoinRequestLocal reasoning above:
  // this is a plain read of already-replicated FSM state, safe to
  // answer from any node's own local copy.
  rpc GetRestartLeaseStateLocal(GetRestartLeaseStateRequest) returns (GetRestartLeaseStateResponse);

  // GetColonyJoinWindowLocal is the read side of ADR-0147 Part 4's
  // Colony join window. Deliberately NOT leader-only, for the same
  // GetRestartLeaseStateLocal reason: the window is already
  // raft-replicated, so any node can answer for itself, and that is
  // the whole point of the design - a joining Comb introduced to a
  // follower must see the same window a join introduced to the leader
  // would see.
  rpc GetColonyJoinWindowLocal(GetColonyJoinWindowRequest) returns (GetColonyJoinWindowResponse);

  // GetColonyUpdateStateLocal is the read side of ADR-0145's colony-wide
  // controlled-update single-flight. It is deliberately named ...Local and
  // deliberately NOT leader-only, for the same GetRestartLeaseStateLocal
  // reason: the state is already raft-replicated, so any node can answer
  // for itself.
  //
  // "Can answer for itself" is not "is authoritative", and the response
  // says which one it is. A follower's copy of an applied record can lag
  // the leader's by one commit, so authoritative is false there and
  // applied_index travels beside the record. Nothing in the enforcement
  // path reads this RPC - every grant, advance and release goes through
  // Apply, which is only ever decided by committed consensus - so a
  // stale local read can mislead a human but can never grant anything.
  rpc GetColonyUpdateStateLocal(GetColonyUpdateStateRequest) returns (GetColonyUpdateStateResponse);

  // StepAsideForRestartLocal is the confirmed leadership step-aside
  // ADR-0145's controlled Colony update performs before a Comb's services
  // are restarted. It is deliberately named ...Local and deliberately NOT
  // leader-only, and those are one decision: this RPC acts on, and reports
  // about, THIS node only. It is never forwarded to the leader. A caller
  // that reaches the wrong Comb gets a truthful no-op for that Comb, never
  // a remote effect - which is why the response carries node_id.
  //
  // Ask it of a follower and the answer is immediate and free: it is not
  // the leader, so there is no leadership to move and it is already safe
  // to restart. Ask it of a leader and it steps that node aside, handing
  // leadership to a peer chosen by the raft library rather than nominated
  // by the caller, so the coordinator needs no membership knowledge and
  // the operator needs no knowledge of who leads.
  //
  // It confirms rather than assumes. The library's future reporting that
  // the transfer routine finished is not the same claim as "another voter
  // is now leading", so this requires an observed, different, non-empty
  // leader before it will answer safe_to_restart, and it never answers
  // true on a handover it could not verify. A node that was leading and
  // could not hand over is told safe_to_restart = false and must stay up.
  //
  // This is the preflight half ADR-0142 refuses to provide for
  // apiary_managerd. It is NOT a substitute for ADR-0103's restart lease:
  // a Comb is only safe to restart once it has ALSO taken a real lease
  // and passed the quorum preflight. Passing this RPC on its own is
  // necessary, never sufficient.
  rpc StepAsideForRestartLocal(StepAsideForRestartRequest) returns (StepAsideForRestartResponse);
}

message ApplyRequest {
  // payload is an opaque, FSM-defined command. Its encoding is not
  // interpreted by raftd itself.
  bytes payload = 1;

  // timeout_ms bounds how long to wait for the command to be committed and
  // applied. A value of 0 selects raftd's default timeout.
  uint32 timeout_ms = 2;
}

message ApplyResponse {
  // result is the opaque value returned by the FSM's Apply method.
  bytes result = 1;

  // error is set (non-empty) if the apply failed, including when this node
  // is not the current leader.
  string error = 2;

  // leader_hint is a best-effort address of the current leader, populated
  // when error indicates this node is not the leader.
  string leader_hint = 3;
}

message StatusRequest {}

message StatusResponse {
  bool is_leader = 1;
  string leader_id = 2;
  string node_id = 3;
  uint64 last_log_index = 4;
  uint64 applied_index = 5;

  // raft_state is one of "Leader", "Follower", "Candidate", or "Shutdown".
  string raft_state = 6;

  // servers lists the current cluster configuration, as known to this
  // node. Useful for verifying membership changes took effect.
  repeated ServerInfo servers = 7;

  // state_digest is a canonical digest of this node's own FSM state
  // (ADR-0143). It is a lowercase hex SHA-256, recomputed on every Apply
  // and served from a cache, and is NEVER empty on a node whose raftd is
  // up - an empty digest therefore means "not observed", not "empty
  // state", which is what lets a consumer tell a readable node from an
  // unreadable one without a separate flag.
  //
  // The applied_index above is deliberately NOT part of the digest: a
  // digest that folded it in would differ on every voter at every
  // instant a cluster is merely making progress, which is a sampling
  // artifact rather than divergence. Pair the two instead - a mismatch
  // at equal applied_index is a real disagreement, and a mismatch at
  // differing applied_index may be nothing but the sample being taken
  // while the cluster moved.
  string state_digest = 8;
}

message ServerInfo {
  string id = 1;
  string address = 2;

  // suffrage is one of "Voter", "Nonvoter", "Staging", or "Unknown" - the
  // last is a real value internal/raft.suffrageString reports for any
  // raft.ServerSuffrage it doesn't recognize, not a placeholder for "not
  // checked." A consumer must never treat "Unknown" as equivalent to
  // "Voter" - see ADR-0056.
  string suffrage = 3;
}

message AddVoterRequest {
  string id = 1;
  string address = 2;

  // prev_index, if non-zero, only applies this change if the cluster
  // configuration's log index still matches it (a CAS-style guard against
  // concurrent membership changes). 0 skips the check.
  uint64 prev_index = 3;

  uint32 timeout_ms = 4;
}

message AddVoterResponse {
  string error = 1;
  string leader_hint = 2;
}

message RemoveServerRequest {
  string id = 1;
  uint64 prev_index = 2;
  uint32 timeout_ms = 3;
}

message RemoveServerResponse {
  string error = 1;
  string leader_hint = 2;
}

message GetVMRequest {
  string id = 1;
}

message GetVMResponse {
  VMDefinition vm = 1;

  // found is false if no VM with the given id exists (distinct from
  // error, which indicates the read itself couldn't be served, e.g. this
  // node isn't the leader).
  bool found = 2;

  string error = 3;
  string leader_hint = 4;
}

message ListVMsRequest {}

message ListVMsResponse {
  repeated VMDefinition vms = 1;
  string error = 2;
  string leader_hint = 3;
}

message GetNetworkRequest {
  string id = 1;
}

message GetNetworkResponse {
  NetworkDefinition network = 1;
  bool found = 2;
  string error = 3;
  string leader_hint = 4;
}

message ListNetworksRequest {}

message ListNetworksResponse {
  repeated NetworkDefinition networks = 1;
  string error = 2;
  string leader_hint = 3;
}

message GetPendingJoinRequestRequest {
  string request_id = 1;
}

message GetPendingJoinRequestResponse {
  PendingJoinRequest request = 1;
  string error = 2;
}

message ListPendingJoinRequestsRequest {}

message ListPendingJoinRequestsResponse {
  repeated PendingJoinRequest requests = 1;
  string error = 2;
}

message GetRestartLeaseStateRequest {
  string service = 1;
}

message GetRestartLeaseStateResponse {
  // lease is unset when no lease is currently held for service.
  RestartLease lease = 1;
  // record is unset when no restart of service has ever been confirmed
  // complete on this node's own view of replicated state.
  RestartRecord record = 2;
  string error = 3;
}

message GetColonyUpdateStateRequest {
  // operation_id, when set, asks for one specific operation's record
  // rather than the colony-wide answer. Empty asks "what is happening
  // right now, and what has happened before".
  string operation_id = 1;
}

message GetColonyUpdateStateResponse {
  // active is the one in-flight operation, unset when nothing is running.
  // Its presence IS the single-flight, as this node can see it.
  ColonyUpdate active = 1;
  // history is every settled operation, newest first, capped by the FSM
  // (see internal/raft/colonyupdate.go's own cap constant for why an
  // unbounded one would be a problem in replicated state).
  repeated ColonyUpdate history = 2;
  // authoritative is true only when this node is the raft leader, and
  // therefore only when the answer above is this node's own most recent
  // committed state rather than a copy that may still be catching up.
  bool authoritative = 3;
  // applied_index is this node's own applied index at the moment of the
  // read, so a consumer can reason about how fresh the answer is even
  // when authoritative is true.
  uint64 applied_index = 4;
  string error = 5;
}

message StepAsideForRestartRequest {
  // timeout_ms bounds the whole step-aside, the confirmation wait
  // included. 0 selects raft.DefaultStepAsideTimeout. The caller's own
  // gRPC deadline still applies, and when it is the shorter of the two it
  // is what actually bounds the wait - a caller about to kill this
  // process wants an answer, not a hang.
  uint64 timeout_ms = 1;
}

message StepAsideForRestartResponse {
  // node_id is the Comb this answer is about: the node that served the
  // request, which is not necessarily the Comb the caller meant to ask
  // about. Carried so a misplaced call is visible rather than silently
  // answered for the wrong machine.
  string node_id = 1;

  // was_leader is whether THIS node held leadership when asked. False in
  // the common case, three steps out of four in a sweep.
  bool was_leader = 2;

  // transferred is whether a handover was actually initiated and
  // reported successful by the raft library. A true here is not a licence
  // on its own; safe_to_restart is what was actually confirmed.
  bool transferred = 3;

  // new_leader_id is the voter leadership landed on, empty when no
  // transfer happened.
  string new_leader_id = 4;

  // safe_to_restart is the answer, and the only field a caller should act
  // on. True only when this node is not the leader, either because it
  // never was or because leadership demonstrably moved elsewhere first.
  bool safe_to_restart = 5;

  // detail is operator-readable prose carrying the evidence for that
  // answer. Never empty, on any path, including failures.
  string detail = 6;

  // error is set when the step-aside did not complete: a deadline, a
  // cancelled context, a transfer the library refused, or a second
  // concurrent step-aside already in flight on this node. It is a field
  // rather than a gRPC status, matching every other RPC in this service,
  // so a caller reads safe_to_restart, was_leader and the evidence
  // together instead of inferring them from a transport error. Whenever
  // it is set, safe_to_restart is false.
  string error = 7;
}

message GetJailRequest {
  string id = 1;
}

message GetJailResponse {
  JailDefinition jail = 1;
  bool found = 2;
  string error = 3;
  string leader_hint = 4;
}

message ListJailsRequest {}

message ListJailsResponse {
  repeated JailDefinition jails = 1;
  string error = 2;
  string leader_hint = 3;
}

message ValidateAPIKeyHashRequest {
  // hashed_key may be empty - see the RPC's own doc comment.
  string hashed_key = 1;
}

message ValidateAPIKeyHashResponse {
  bool valid = 1;
  string key_id = 2;

  // auth_enabled reflects FSMSnapshotState.auth_enabled: true forever
  // once the first API key was ever created, even if every key is
  // later revoked - this is what makes revoking the last key lock the
  // cluster down rather than silently reopening it. See ADR-0023.
  bool auth_enabled = 3;

  // error is set only for a real failure reading FSM state - never
  // used to report "invalid key" or "auth not enabled yet", both of
  // which are ordinary, expected outcomes carried in valid/
  // auth_enabled above.
  string error = 4;

  // role is the matched key's role ("admin"/"operator"/"viewer",
  // ADR-0030) - meaningless (empty) when valid is false.
  string role = 5;
}

message ListAPIKeysRequest {}

message ListAPIKeysResponse {
  repeated ApiKey keys = 1;
  string error = 2;
  string leader_hint = 3;
}

message ExportStateRequest {}

message ExportStateResponse {
  // fsm_snapshot_state is proto.Marshal(FSMSnapshotState) of this
  // node's live state as of the call - the same wire format
  // FSM.Persist already writes for raft's own periodic snapshots, so
  // the CLI caller can reuse it byte-for-byte as the seed for a later
  // -restore, with no format conversion.
  bytes fsm_snapshot_state = 1;

  uint64 applied_index = 2;
  string node_id = 3;
  string error = 4;
  string leader_hint = 5;
}

// GetColonyJoinWindowRequest/GetColonyJoinWindowResponse carry the
// local FSM's copy of ADR-0147 Part 4's ColonyJoinWindow. The response
// repeats the message rather than flattening it, so the raft-side
// schema and the manager-side one cannot drift apart.
message GetColonyJoinWindowRequest {}

message GetColonyJoinWindowResponse {
  // window is this node's own replicated copy, nil if the Colony has
  // never had a window opened.
  ColonyJoinWindow window = 1;

  // live is whether that window is still open at this node's clock.
  // It travels beside the window rather than being left to the caller
  // to compute, so the liveness answer and the state it was computed
  // from can never be two separate reads taken at different moments.
  bool live = 2;
}
