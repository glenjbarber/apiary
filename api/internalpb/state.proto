syntax = "proto3";

package apiary.internal.v1;

option go_package = "github.com/glenjbarber/apiary/api/internalpb;internalpb";

// This file defines the real ephemeral-state schema that Apply's payload
// now carries, replacing the opaque bytes used while the raft/protocol
// stack itself was being proven out. Per CLAUDE.md, ephemeral state is
// small, JSON-shaped facts — VM definitions and node ownership — as
// opposed to physical state (ZFS datasets, HAST-replicated bytes), which
// never goes through raft.

// VMState is the desired run state of a VM, as recorded in ephemeral
// state. It does not reflect bhyve's actual runtime state (no bhyve
// backend exists yet) - it is what the backend should converge toward
// once one exists.
enum VMState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_STOPPED = 1;
  VM_STATE_RUNNING = 2;

  // VM_STATE_DELETING is a soft-delete tombstone: DeleteVM sets this
  // instead of removing the record outright (unless the VM was never
  // assigned to a node, in which case there's nothing physical to tear
  // down and it's removed immediately). The owning node's reconciler
  // notices this, tears down its real dataset/bhyve VM, then submits
  // PurgeVM to remove the record for good - see ADR-0016.
  VM_STATE_DELETING = 3;
}

// VMPhase is the reconciler's own observed progress toward a VM's
// desired state - distinct from desired_state, which is only ever what
// a caller asked for. Written back by the owning node's reconciler via
// UpdateVMPhase, never by CreateVM/UpdateVM directly.
enum VMPhase {
  VM_PHASE_UNSPECIFIED = 0; // not yet reconciled by any node
  VM_PHASE_CREATING = 1;
  VM_PHASE_READY = 2;
  VM_PHASE_DELETING = 3;
  VM_PHASE_ERROR = 4;
}

// VMDefinition is a VM's ephemeral definition: its identity, resource
// shape, which node owns it, and its desired state. It intentionally
// excludes physical data (disk image bytes, ZFS dataset contents) - those
// stay local per node, replicated by HAST, not by raft.
message VMDefinition {
  string id = 1;
  string name = 2;
  uint32 vcpus = 3;
  uint64 memory_mb = 4;

  // node_id is the node ownership assignment: which cluster member is
  // responsible for running this VM.
  string node_id = 5;

  VMState desired_state = 6;

  VMPhase phase = 7;

  // phase_error holds the last reconcile error's message when phase ==
  // VM_PHASE_ERROR; empty otherwise.
  string phase_error = 8;

  // iso_name, if set, names an image already uploaded (via
  // ManagerService.UploadISO) on the assigned node. The reconciler
  // resolves it to a local path through internal/isostore and attaches
  // it as a CD-ROM device - see ADR-0017.
  string iso_name = 9;

  // network_id, if set, names a NetworkDefinition this VM's NIC belongs
  // to. Empty means the flat single-bridge behavior from before network
  // management existed (Reconciler's own node-wide Bridge field) -
  // unchanged for backward compatibility. See ADR-0022.
  string network_id = 10;

  // ip_address/mac_address are assigned by the FSM itself when
  // CreateVM runs (see applyCreateVM) if network_id is set - never by
  // the caller, and never mutated afterward. Both are deterministic
  // given the already-committed raft log, so every replica computes the
  // same values without needing a separate allocation round-trip.
  string ip_address = 11;
  string mac_address = 12;

  // firewall_rules is a simple allow/block list applied to this VM's
  // traffic via a per-VM pf(8) anchor (internal/pf). No rules means
  // today's de facto behavior (everything allowed) - rules are opt-in
  // restrictions, so an existing VM with none is unaffected.
  repeated FirewallRule firewall_rules = 13;
}

// FirewallRule is one pf(8) rule applied to a VM's per-VM anchor. See
// internal/pf.RenderRules for how these compile to actual pf syntax.
message FirewallRule {
  // direction is "in" or "out".
  string direction = 1;
  // action is "pass" or "block".
  string action = 2;
  // protocol is "tcp", "udp", "icmp", or "" (any).
  string protocol = 3;
  // port_range is a single port ("22"), a range ("8000-9000"), or ""
  // (any) - meaningless when protocol is "icmp" or "".
  string port_range = 4;
}

// NetworkDefinition is a named, cluster-wide L2 segment: a VLAN ID (0 =
// untagged) plus a subnet. Like VMDefinition, this is a small
// coordination fact replicated through raft - every node must agree on
// which VLAN ID and subnet a network name refers to, so two nodes never
// double-assign an IP or a VLAN tag. Creating the actual vlan(4)/
// bridge(4) interfaces this implies is physical, per-node work done by
// internal/cluster's Reconciler (internal/vlan), not stored here. See
// ADR-0022.
message NetworkDefinition {
  string id = 1;
  string name = 2;

  // vlan_id is 0 for an untagged network (VMs share the uplink's own
  // L2 segment directly) or a real 802.1Q VLAN tag otherwise.
  uint32 vlan_id = 3;

  // subnet is a CIDR (e.g. "10.60.0.0/24"). The FSM allocates VM IPs
  // from this range (see VMDefinition.ip_address); the reconciler
  // assigns the range's first host address (".1") to the bridge
  // interface itself as the gateway.
  string subnet = 4;

  // bridge_name, if set, overrides the bridge name the reconciler uses
  // for this network on every node (default, when empty: a short hash
  // of id - see internal/cluster.networkBridgeName; FreeBSD interface
  // names are capped at 15 usable characters, so id can't be embedded
  // directly). There's no reason to need this in practice - present
  // mainly so a name collision with something outside Apiary's own
  // management has an escape hatch.
  string bridge_name = 5;
}

// Command is the typed payload carried in ApplyRequest.payload (replacing
// v1's opaque bytes). Exactly one op should be set.
message Command {
  oneof op {
    CreateVM create_vm = 1;
    UpdateVM update_vm = 2;
    DeleteVM delete_vm = 3;

    // UpdateVMPhase and PurgeVM are submitted by a node's own reconciler,
    // never by an external caller - see ADR-0016.
    UpdateVMPhase update_vm_phase = 4;
    PurgeVM purge_vm = 5;

    CreateNetwork create_network = 6;
    DeleteNetwork delete_network = 7;
  }
}

// CreateNetwork adds a new NetworkDefinition. It fails if a network with
// the same id already exists.
message CreateNetwork {
  NetworkDefinition network = 1;
}

// DeleteNetwork removes a NetworkDefinition outright - no soft-delete
// tombstone, unlike DeleteVM, since a network has no physical resources
// of its own to reconcile away first (the vlan/bridge interfaces it
// implies are recreated/destroyed per-node as a side effect of VMs
// coming and going, not owned by the network record itself). Fails if
// the network doesn't exist, or if any VM still references it via
// network_id - no cascade/orphan-reclaim, matching the same caution
// already accepted for VM deletion (ADR-0016).
message DeleteNetwork {
  string id = 1;
}

// CreateVM adds a new VM definition. It fails (via CommandResult.error) if
// a VM with the same id already exists.
message CreateVM {
  VMDefinition vm = 1;
}

// UpdateVM replaces an existing VM definition. It fails if no VM with the
// given id exists.
message UpdateVM {
  VMDefinition vm = 1;
}

// DeleteVM marks a VM definition for deletion (see VM_STATE_DELETING). It
// fails if no VM with the given id exists.
message DeleteVM {
  string id = 1;
}

// UpdateVMPhase records reconciliation progress against an existing VM
// definition. Unlike UpdateVM, it never touches desired_state - only the
// observed phase. It's a no-op error (not applied) if the VM no longer
// exists, which can happen if it was purged out from under a stale
// reconcile attempt.
message UpdateVMPhase {
  string id = 1;
  VMPhase phase = 2;
  string phase_error = 3;
}

// PurgeVM removes a VM definition outright, regardless of its current
// phase. Submitted only by the owning node's reconciler, after it has
// confirmed the VM's real local resources are torn down. Idempotent: not
// an error if the id is already gone.
message PurgeVM {
  string id = 1;
}

// CommandResult is the FSM's response to Apply, echoed back through
// ApplyResponse. error is set (and vm left unset) if the command was
// rejected at the application level (e.g. duplicate/missing id) - this is
// distinct from raft-level failures (not leader, timeout), which are
// reported as a normal RPC error instead.
message CommandResult {
  VMDefinition vm = 1;
  string error = 2;
}

// FSMSnapshotState is the full ephemeral state persisted by
// raft.FSM.Snapshot/Restore.
message FSMSnapshotState {
  uint64 last_index = 1;
  map<string, VMDefinition> vms = 2;
  map<string, NetworkDefinition> networks = 3;
}
