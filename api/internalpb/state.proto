syntax = "proto3";

package apiary.internal.v1;

option go_package = "github.com/glenjbarber/apiary/api/internalpb;internalpb";

// This file defines the real ephemeral-state schema that Apply's payload
// now carries, replacing the opaque bytes used while the raft/protocol
// stack itself was being proven out. Per CLAUDE.md, ephemeral state is
// small, JSON-shaped facts — VM definitions and node ownership — as
// opposed to physical state (ZFS datasets, HAST-replicated bytes), which
// never goes through raft.

// VMState is the desired run state of a VM, as recorded in ephemeral
// state. It does not reflect bhyve's actual runtime state (no bhyve
// backend exists yet) - it is what the backend should converge toward
// once one exists.
enum VMState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_STOPPED = 1;
  VM_STATE_RUNNING = 2;

  // VM_STATE_DELETING is a soft-delete tombstone: DeleteVM sets this
  // instead of removing the record outright (unless the VM was never
  // assigned to a node, in which case there's nothing physical to tear
  // down and it's removed immediately). The owning node's reconciler
  // notices this, tears down its real dataset/bhyve VM, then submits
  // PurgeVM to remove the record for good - see ADR-0016.
  VM_STATE_DELETING = 3;
}

// VMPhase is the reconciler's own observed progress toward a VM's
// desired state - distinct from desired_state, which is only ever what
// a caller asked for. Written back by the owning node's reconciler via
// UpdateVMPhase, never by CreateVM/UpdateVM directly.
enum VMPhase {
  VM_PHASE_UNSPECIFIED = 0; // not yet reconciled by any node
  VM_PHASE_CREATING = 1;
  VM_PHASE_READY = 2;
  VM_PHASE_DELETING = 3;
  VM_PHASE_ERROR = 4;
}

// VMDefinition is a VM's ephemeral definition: its identity, resource
// shape, which node owns it, and its desired state. It intentionally
// excludes physical data (disk image bytes, ZFS dataset contents) - those
// stay local per node, replicated by HAST, not by raft.
message VMDefinition {
  string id = 1;
  string name = 2;
  uint32 vcpus = 3;
  uint64 memory_mb = 4;

  // node_id is the node ownership assignment: which cluster member is
  // responsible for running this VM.
  string node_id = 5;

  VMState desired_state = 6;

  VMPhase phase = 7;

  // phase_error holds the last reconcile error's message when phase ==
  // VM_PHASE_ERROR; empty otherwise.
  string phase_error = 8;

  // iso_name, if set, names an image already uploaded (via
  // ManagerService.UploadISO) on the assigned node. The reconciler
  // resolves it to a local path through internal/isostore and attaches
  // it as a CD-ROM device - see ADR-0017.
  string iso_name = 9;

  // network_id, if set, names a NetworkDefinition this VM's NIC belongs
  // to. Empty means the flat single-bridge behavior from before network
  // management existed (Reconciler's own node-wide Bridge field) -
  // unchanged for backward compatibility. See ADR-0022.
  string network_id = 10;

  // ip_address/mac_address are assigned by the FSM itself when
  // CreateVM runs (see applyCreateVM) if network_id is set - never by
  // the caller, and never mutated afterward. Both are deterministic
  // given the already-committed raft log, so every replica computes the
  // same values without needing a separate allocation round-trip.
  string ip_address = 11;
  string mac_address = 12;

  // firewall_rules is a simple allow/block list applied to this VM's
  // traffic via a per-VM pf(8) anchor (internal/pf). No rules means
  // today's de facto behavior (everything allowed) - rules are opt-in
  // restrictions, so an existing VM with none is unaffected.
  repeated FirewallRule firewall_rules = 13;

  // replica_node_id, if set, names a second cluster node that
  // replicates this VM's disk via HAST (ADR-0025) - real-time block
  // replication for data redundancy, not automatic failover (only a
  // bhyve-capable node can ever run the VM). Caller-set, exactly like
  // node_id - this project deliberately has no automatic node
  // scheduling for either field. Empty means the unreplicated,
  // dataset-plus-file disk path from before this existed - unchanged
  // behavior for every VM that doesn't set this.
  string replica_node_id = 14;

  // base_image_name, if set, names a raw disk image already uploaded
  // (via ManagerService.UploadISO, reusing internal/isostore's existing
  // store - a base image is just another named, hash-verified local
  // file) on the assigned node. The reconciler resolves it exactly like
  // iso_name and, only when first creating this VM's disk file, seeds it
  // by copying the base image instead of creating a blank file - see
  // ADR-0031. Empty means today's behavior (a blank disk). Ignored for a
  // disk file that already exists (never re-seeded on every tick).
  string base_image_name = 15;

  // firewall_paused, when true, tells the reconciler to leave this VM's
  // pf(8) anchor with no active rules (everything allowed) regardless
  // of firewall_rules - a temporary, reversible override for
  // troubleshooting that leaves the configured rule list itself
  // untouched. Set only via the narrow SetVMFirewallPaused command,
  // never via UpdateVM - see ADR-0049 for why UpdateVM's full-replace
  // semantics make it unsafe for a single-field toggle like this.
  bool firewall_paused = 16;

  // cloudflare_hostname, if set, names a public hostname this VM's own
  // HTTP service (on cloudflare_port) should be reachable at via a
  // pre-provisioned Cloudflare Tunnel on its owning node - see
  // ADR-0063. Empty means not exposed (today's behavior, unaffected).
  // Requires network_id to also be set: a flat-bridge VM's IP is never
  // tracked in raft state, so there is no address for a Tunnel to
  // proxy to. Set only via the narrow SetVMCloudflareExposure command,
  // never via UpdateVM, for the exact same full-replace-safety reason
  // firewall_paused is (see ADR-0049, ADR-0063).
  string cloudflare_hostname = 17;

  // cloudflare_port is the local TCP port on this VM's own address that
  // an exposed hostname's cloudflared ingress rule proxies to, always
  // as plain HTTP (see ADR-0063 for why v1 is HTTP-origin-only, never
  // raw TCP or HTTPS-origin). Meaningless when cloudflare_hostname is
  // empty.
  uint32 cloudflare_port = 18;
}

// JailState is the desired run state of a jail, mirroring VMState.
enum JailState {
  JAIL_STATE_UNSPECIFIED = 0;
  JAIL_STATE_STOPPED = 1;
  JAIL_STATE_RUNNING = 2;

  // JAIL_STATE_DELETING is a soft-delete tombstone, exactly like
  // VM_STATE_DELETING - see its doc comment above.
  JAIL_STATE_DELETING = 3;
}

// JailPhase is the reconciler's own observed progress toward a jail's
// desired state, mirroring VMPhase.
enum JailPhase {
  JAIL_PHASE_UNSPECIFIED = 0;
  JAIL_PHASE_CREATING = 1;
  JAIL_PHASE_READY = 2;
  JAIL_PHASE_DELETING = 3;
  JAIL_PHASE_ERROR = 4;
}

// JailDefinition is a jail's ephemeral definition, deliberately minimal
// compared to VMDefinition: no vcpus/memory/ISO/firewall fields, since
// internal/jail's v1 scope is flat ip4=inherit networking with no
// dedicated resource limits or attached media. Physical data (the
// jail's root filesystem contents) stays local per node, replicated by
// HAST when replica_node_id is set, never by raft - same split as
// VMDefinition.
message JailDefinition {
  string id = 1;
  string name = 2;

  // hostname is passed to jail(8) as its own hostname - distinct from
  // name/id, which are Apiary's own identifiers (internal/jail has no
  // hierarchical namespace, so id/name double as the jail(8) name too).
  string hostname = 3;

  // node_id is the node ownership assignment: which cluster member is
  // responsible for running this jail.
  string node_id = 4;

  // replica_node_id, if set, names a second cluster node that
  // replicates this jail's root filesystem via HAST (ADR-0026) - the
  // exact same data-redundancy-not-failover semantics as
  // VMDefinition.replica_node_id.
  string replica_node_id = 5;

  JailState desired_state = 6;

  JailPhase phase = 7;

  // phase_error holds the last reconcile error's message when phase ==
  // JAIL_PHASE_ERROR; empty otherwise.
  string phase_error = 8;
}

// FirewallRule is one pf(8) rule applied to a VM's per-VM anchor. See
// internal/pf.RenderRules for how these compile to actual pf syntax.
message FirewallRule {
  // direction is "in" or "out".
  string direction = 1;
  // action is "pass" or "block".
  string action = 2;
  // protocol is "tcp", "udp", "icmp", or "" (any).
  string protocol = 3;
  // port_range is a single port ("22"), a range ("8000-9000"), or ""
  // (any) - meaningless when protocol is "icmp" or "".
  string port_range = 4;
}

// NetworkDefinition is a named, cluster-wide L2 segment: a VLAN ID (0 =
// untagged) plus a subnet. Like VMDefinition, this is a small
// coordination fact replicated through raft - every node must agree on
// which VLAN ID and subnet a network name refers to, so two nodes never
// double-assign an IP or a VLAN tag. Creating the actual vlan(4)/
// bridge(4) interfaces this implies is physical, per-node work done by
// internal/cluster's Reconciler (internal/vlan), not stored here. See
// ADR-0022.
message NetworkDefinition {
  string id = 1;
  string name = 2;

  // vlan_id is 0 for an untagged network (VMs share the uplink's own
  // L2 segment directly) or a real 802.1Q VLAN tag otherwise.
  uint32 vlan_id = 3;

  // subnet is a CIDR (e.g. "10.60.0.0/24"). The FSM allocates VM IPs
  // from this range (see VMDefinition.ip_address); the reconciler
  // assigns the range's first host address (".1") to the bridge
  // interface itself as the gateway.
  string subnet = 4;

  // bridge_name, if set, overrides the bridge name the reconciler uses
  // for this network on every node (default, when empty: a short hash
  // of id - see internal/cluster.networkBridgeName; FreeBSD interface
  // names are capped at 15 usable characters, so id can't be embedded
  // directly). There's no reason to need this in practice - present
  // mainly so a name collision with something outside Apiary's own
  // management has an escape hatch.
  string bridge_name = 5;

  // external_gateway, if set, is the address of a real router already
  // serving as this subnet's gateway/DNS (e.g. a hand-configured
  // firewall sharing this VLAN with non-Apiary traffic) - almost
  // always still subnet's own ".1", just not one Apiary itself owns.
  // When set, the reconciler does NOT assign subnet's ".1" to its own
  // per-network bridge on any node (see EnsureBridgeAddress's normal
  // behavior above) - claiming that address here would conflict with
  // the real router owning it on the same L2 segment - and DHCP
  // advertises this address as the router (option 3) instead of
  // dnsmasq's own default self-advertisement. Empty (the default)
  // preserves today's behavior exactly: Apiary's own bridge is the
  // gateway.
  string external_gateway = 6;
}

// Command is the typed payload carried in ApplyRequest.payload (replacing
// v1's opaque bytes). Exactly one op should be set.
message Command {
  oneof op {
    CreateVM create_vm = 1;
    UpdateVM update_vm = 2;
    DeleteVM delete_vm = 3;

    // UpdateVMPhase and PurgeVM are submitted by a node's own reconciler,
    // never by an external caller - see ADR-0016.
    UpdateVMPhase update_vm_phase = 4;
    PurgeVM purge_vm = 5;

    CreateNetwork create_network = 6;
    DeleteNetwork delete_network = 7;

    CreateAPIKey create_api_key = 8;
    RevokeAPIKey revoke_api_key = 9;

    CreateJail create_jail = 10;
    UpdateJail update_jail = 11;
    DeleteJail delete_jail = 12;

    // UpdateJailPhase and PurgeJail are submitted by a node's own
    // reconciler, never by an external caller - mirrors
    // UpdateVMPhase/PurgeVM above.
    UpdateJailPhase update_jail_phase = 13;
    PurgeJail purge_jail = 14;

    // SetVMFirewallPaused is submitted by an external caller (via
    // ManagerService.SetVMFirewallPaused) - unlike UpdateVMPhase/
    // PurgeVM above, this is not reconciler-only. Deliberately narrow
    // (touches only VMDefinition.firewall_paused) rather than routed
    // through the general UpdateVM, which replaces a VM's entire
    // record - see ADR-0049.
    SetVMFirewallPaused set_vm_firewall_paused = 15;

    // SetVMCloudflareExposure is submitted by an external caller (via
    // ManagerService.SetVMCloudflareExposure) - deliberately narrow
    // (touches only VMDefinition.cloudflare_hostname/cloudflare_port),
    // the exact same reasoning as SetVMFirewallPaused above. See
    // ADR-0063.
    SetVMCloudflareExposure set_vm_cloudflare_exposure = 16;
  }
}

// ApiKey is a cluster-wide credential for ManagerService's external
// gRPC API (ADR-0023). Only hashed_key (a SHA-256 hex digest) is ever
// stored or replicated - the raw key is generated once by managerd's
// CreateAPIKey RPC handler and returned to the caller exactly once; it
// is never recoverable from ephemeral state again after that.
message ApiKey {
  string id = 1;
  string name = 2;
  string hashed_key = 3;
  int64 created_unix = 4;

  // role is one of "admin"/"operator"/"viewer" (ADR-0030) - gates
  // which RPCs a caller presenting this key may invoke, once auth is
  // enabled. An empty/unrecognized value is normalized to "viewer"
  // (least privilege) by applyCreateAPIKey - never treated as "no
  // restriction".
  string role = 5;
}

// CreateAPIKey adds a new ApiKey. It fails if an id collision occurs
// (vanishingly unlikely - managerd generates the id itself).
message CreateAPIKey {
  ApiKey key = 1;
}

// RevokeAPIKey removes an ApiKey outright - no soft-delete tombstone,
// the same reasoning as DeleteNetwork (a key has no physical resource
// to reconcile away first). Fails if the id doesn't exist.
message RevokeAPIKey {
  string id = 1;
}

// CreateNetwork adds a new NetworkDefinition. It fails if a network with
// the same id already exists.
message CreateNetwork {
  NetworkDefinition network = 1;
}

// DeleteNetwork removes a NetworkDefinition outright - no soft-delete
// tombstone, unlike DeleteVM, since a network has no physical resources
// of its own to reconcile away first (the vlan/bridge interfaces it
// implies are recreated/destroyed per-node as a side effect of VMs
// coming and going, not owned by the network record itself). Fails if
// the network doesn't exist, or if any VM still references it via
// network_id - no cascade/orphan-reclaim, matching the same caution
// already accepted for VM deletion (ADR-0016).
message DeleteNetwork {
  string id = 1;
}

// CreateVM adds a new VM definition. It fails (via CommandResult.error) if
// a VM with the same id already exists.
message CreateVM {
  VMDefinition vm = 1;
}

// UpdateVM replaces an existing VM definition. It fails if no VM with the
// given id exists.
message UpdateVM {
  VMDefinition vm = 1;
}

// DeleteVM marks a VM definition for deletion (see VM_STATE_DELETING). It
// fails if no VM with the given id exists.
message DeleteVM {
  string id = 1;
}

// UpdateVMPhase records reconciliation progress against an existing VM
// definition. Unlike UpdateVM, it never touches desired_state - only the
// observed phase. It's a no-op error (not applied) if the VM no longer
// exists, which can happen if it was purged out from under a stale
// reconcile attempt.
message UpdateVMPhase {
  string id = 1;
  VMPhase phase = 2;
  string phase_error = 3;
}

// SetVMFirewallPaused toggles VMDefinition.firewall_paused on an
// existing VM. Fails if the id doesn't exist.
message SetVMFirewallPaused {
  string id = 1;
  bool paused = 2;
}

// SetVMCloudflareExposure sets VMDefinition.cloudflare_hostname/
// cloudflare_port on an existing VM. Fails if the id doesn't exist, or
// if hostname is non-empty and the VM's current network_id is empty
// (see ADR-0063) - this check happens in the RPC handler before
// submission, since the FSM apply step itself has no validation
// beyond "does the VM exist" (matching every other narrow Set*
// command's own division of labor).
message SetVMCloudflareExposure {
  string id = 1;
  string hostname = 2;
  uint32 port = 3;
}

// PurgeVM removes a VM definition outright, regardless of its current
// phase. Submitted only by the owning node's reconciler, after it has
// confirmed the VM's real local resources are torn down. Idempotent: not
// an error if the id is already gone.
message PurgeVM {
  string id = 1;
}

// CreateJail adds a new JailDefinition. It fails if a jail with the
// same id already exists.
message CreateJail {
  JailDefinition jail = 1;
}

// UpdateJail replaces an existing jail definition. It fails if no jail
// with the given id exists.
message UpdateJail {
  JailDefinition jail = 1;
}

// DeleteJail marks a jail definition for deletion (see
// JAIL_STATE_DELETING), mirroring DeleteVM exactly. It fails if no
// jail with the given id exists.
message DeleteJail {
  string id = 1;
}

// UpdateJailPhase records reconciliation progress against an existing
// jail definition, mirroring UpdateVMPhase exactly.
message UpdateJailPhase {
  string id = 1;
  JailPhase phase = 2;
  string phase_error = 3;
}

// PurgeJail removes a jail definition outright, mirroring PurgeVM
// exactly. Idempotent: not an error if the id is already gone.
message PurgeJail {
  string id = 1;
}

// CommandResult is the FSM's response to Apply, echoed back through
// ApplyResponse. error is set (and vm left unset) if the command was
// rejected at the application level (e.g. duplicate/missing id) - this is
// distinct from raft-level failures (not leader, timeout), which are
// reported as a normal RPC error instead.
message CommandResult {
  VMDefinition vm = 1;
  string error = 2;
  JailDefinition jail = 3;
}

// FSMSnapshotState is the full ephemeral state persisted by
// raft.FSM.Snapshot/Restore.
message FSMSnapshotState {
  uint64 last_index = 1;
  map<string, VMDefinition> vms = 2;
  map<string, NetworkDefinition> networks = 3;
  map<string, ApiKey> api_keys = 4;
  map<string, JailDefinition> jails = 6;

  // auth_enabled is set permanently, forever, the first time any
  // CreateAPIKey command ever succeeds - unlike api_keys' own size,
  // it never reverts to false even if every key is later revoked.
  // managerd's auth check gates on this, not on api_keys being
  // non-empty: revoking the last key must lock the cluster down, not
  // silently reopen it (see ADR-0023).
  bool auth_enabled = 5;
}

// ConfigArchive is the on-disk file format for raftd's -export/
// -restore (docs/adr/0051-raftd-config-save-restore.md) - a small
// envelope around an unmodified FSMSnapshotState payload, versioned
// and checksummed independently of raft's own on-disk CRC64 since a
// portable archive may sit outside raftd's data directory, on
// removable media, for a long time before being read back.
message ConfigArchive {
  // format_version is this envelope's own schema version, starting at
  // 1 - independent of FSMSnapshotState's own field additions (it has
  // already grown once: api_keys/jails were added after the original
  // vms/networks/last_index).
  uint32 format_version = 1;

  // exported_unix/node_id/applied_index are provenance only, never
  // consulted for correctness - the checksum below is what -restore
  // actually verifies before trusting fsm_snapshot_state.
  int64 exported_unix = 2;
  string node_id = 3;
  uint64 applied_index = 4;

  // fsm_snapshot_state is proto.Marshal(FSMSnapshotState), unchanged -
  // the exact same bytes FSM.Persist already writes for raft's own
  // snapshots.
  bytes fsm_snapshot_state = 5;

  // checksum is SHA-256(fsm_snapshot_state), verified by -restore
  // before touching anything.
  bytes checksum = 6;
}
