syntax = "proto3";

package apiary.rpc.v1;

option go_package = "github.com/glenjbarber/apiary/api/rpc;rpcpb";

// ManagerService is the external RPC API exposed by managerd.
// CreateVM/UpdateVM/DeleteVM record ephemeral VM definitions via raftd -
// there is still no bhyve/jail/zfs backend, so nothing actually runs a VM
// yet, but the definitions are real, replicated, and persisted.
service ManagerService {
  rpc Status(StatusRequest) returns (StatusResponse);

  rpc CreateVM(CreateVMRequest) returns (CreateVMResponse);
  rpc UpdateVM(UpdateVMRequest) returns (UpdateVMResponse);
  rpc DeleteVM(DeleteVMRequest) returns (DeleteVMResponse);

  // ForcePurgeVM is an escape hatch for a VM tombstoned by DeleteVM
  // whose owning node will never reconcile it away (permanently
  // offline/decommissioned) - see CLAUDE.md's "What's not implemented
  // yet" note on resource reclaim. It only succeeds against a VM
  // already in VM_STATE_DELETING (call DeleteVM first) and removes the
  // record outright, the same way the owning node's own reconciler
  // would via PurgeVM - but it does NOT touch that node's real ZFS
  // dataset or bhyve VM, since (by definition, this being needed at
  // all) that node can't be reached. Use only when the owning node is
  // confirmed gone for good; otherwise its resources are silently
  // orphaned with no record left to indicate they exist.
  rpc ForcePurgeVM(ForcePurgeVMRequest) returns (ForcePurgeVMResponse);

  // MigrateVM is a manual, explicit, human-triggered operation moving
  // a VM's ownership to target_node_id - Apiary has no automatic
  // scheduling (CLAUDE.md's deliberate stance), so this exists purely
  // to fill the "there's no way to move a VM at all" gap, not to add
  // scheduling logic. It only succeeds when target_node_id is already
  // this VM's replica_node_id - i.e., a HAST secondary already holding
  // a synced copy of the disk (see ADR-0026/ADR-0028) - since for any
  // other target, the VM's disk isn't present there at all: the
  // reconciler would tear down the real disk on the old node
  // (ADR-0025's resource reclaim) and provision a brand-new EMPTY one
  // on the new node, silently destroying the VM's actual data. This
  // isn't a technical limitation to remove later - it's the same
  // "never allow a silently destructive default" caution this
  // project has applied everywhere else. To migrate a VM with no
  // existing replica: set replica_node_id via UpdateVM first, confirm
  // real replication has reached hastctl's own "status: complete" on
  // the target, then call MigrateVM.
  //
  // On success, node_id and replica_node_id are swapped (the old
  // owner becomes the new secondary, continuing replication back) -
  // the reconciler's existing HAST role machinery converges this
  // exactly like any other role change, no new reconciler logic
  // involved.
  rpc MigrateVM(MigrateVMRequest) returns (MigrateVMResponse);

  // SetVMFirewallPaused temporarily suspends enforcement of a VM's
  // firewall_rules (everything allowed) without discarding the
  // configured rule list - useful for troubleshooting connectivity.
  // Deliberately not folded into UpdateVM: UpdateVM replaces a VM's
  // entire record, so a caller toggling just this one field would risk
  // silently wiping firewall_rules/network_id/etc. unless it first
  // fetched and resent the complete current record - see ADR-0049.
  rpc SetVMFirewallPaused(SetVMFirewallPausedRequest) returns (SetVMFirewallPausedResponse);

  // GetVM and ListVMs only succeed against the current leader - see
  // api/internalpb/raftd.proto's GetVM/ListVMs doc comments for why v1's
  // read consistency model is deliberately as simple as its write model.
  rpc GetVM(GetVMRequest) returns (GetVMResponse);
  rpc ListVMs(ListVMsRequest) returns (ListVMsResponse);

  // UploadISO, ListISOs, and DeleteISO manage installer images stored
  // locally on *this* managerd's own node - unlike VM definitions,
  // these are physical data (see CLAUDE.md's physical/ephemeral
  // distinction) and are never replicated through raft. UploadISO is
  // client-streaming so a large image doesn't have to fit in one
  // message; see ADR-0017 for why verification happens server-side
  // rather than trusting a client-computed hash.
  rpc UploadISO(stream UploadISORequest) returns (UploadISOResponse);
  rpc ListISOs(ListISOsRequest) returns (ListISOsResponse);
  rpc DeleteISO(DeleteISORequest) returns (DeleteISOResponse);

  // HostStats reports a point-in-time snapshot of *this* node's own
  // resource usage and hardware health - physical, per-node data like
  // ISOs above, gathered locally by managerd (see internal/hoststats),
  // never routed through raft.
  rpc HostStats(HostStatsRequest) returns (HostStatsResponse);

  // GetVMConsole reports how to reach a running VM's VNC framebuffer,
  // for the web UI's noVNC-based console page (ADR-0020). Like HostStats,
  // this only answers for a VM actually running on *this* node - see
  // GetVMConsoleResponse's doc comment for the v1 limitation that
  // follows from that.
  rpc GetVMConsole(GetVMConsoleRequest) returns (GetVMConsoleResponse);

  // GetVMSerialLog returns the tail of a VM's captured serial console
  // log (ADR-0032's EnableSerialLog), for the web UI - previously this
  // required an operator to read the file directly on the owning node.
  // Same locality limitation as GetVMConsole: only answers for a VM
  // confirmed running on *this* node.
  rpc GetVMSerialLog(GetVMSerialLogRequest) returns (GetVMSerialLogResponse);

  // GetNodeConfig/UpdateNodeConfig manage this node's own local runtime
  // settings (currently: the uplink interfaces VLAN tagging/outbound
  // NAT use - see ADR-0048) - physical, per-node data like HostStats/
  // ISOs above, never routed through raft (a NIC name is only ever
  // meaningful to the one node that has it). A change here takes
  // effect the next time this node's managerd restarts, not live -
  // see ADR-0049 for why. See internal/nodeconfig.
  rpc GetNodeConfig(GetNodeConfigRequest) returns (GetNodeConfigResponse);
  rpc UpdateNodeConfig(UpdateNodeConfigRequest) returns (UpdateNodeConfigResponse);

  // SetDatasetQuota sets a ZFS quota on a dataset under this node's own
  // configured Base scope (see internal/zfs.Manager) - physical,
  // per-node storage governance, never routed through raft. See
  // ADR-0049 for the v1 limitation that this can only target a named
  // sub-dataset, not the Base dataset itself.
  rpc SetDatasetQuota(SetDatasetQuotaRequest) returns (SetDatasetQuotaResponse);

  // CreateNetwork/ListNetworks/DeleteNetwork manage NetworkDefinitions -
  // VLAN/subnet/bridge segments a VM can attach to (see ADR-0022).
  // CreateNetwork/DeleteNetwork just submit a Command through raft
  // (like CreateVM/DeleteVM); ListNetworks reads current state, subject
  // to the same leader-only requirement as ListVMs.
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse);
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);
  rpc DeleteNetwork(DeleteNetworkRequest) returns (DeleteNetworkResponse);

  // CreateAPIKey/ListAPIKeys/RevokeAPIKey manage credentials for this
  // service's own RPC surface (ADR-0023). CreateAPIKey is the only
  // place a raw key is ever returned - it cannot be retrieved again
  // after this response. Once at least one key exists, every RPC on
  // this service (including these three) requires a valid one; before
  // that, everything remains open, matching this project's behavior
  // today.
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);

  // CreateJail/UpdateJail/DeleteJail/GetJail/ListJails manage
  // JailDefinitions - see ADR-0026's jail-orchestration half. They
  // mirror the VM RPCs above exactly, including GetJail/ListJails'
  // same leader-only read requirement.
  rpc CreateJail(CreateJailRequest) returns (CreateJailResponse);
  rpc UpdateJail(UpdateJailRequest) returns (UpdateJailResponse);
  rpc DeleteJail(DeleteJailRequest) returns (DeleteJailResponse);
  rpc GetJail(GetJailRequest) returns (GetJailResponse);
  rpc ListJails(ListJailsRequest) returns (ListJailsResponse);

  // ForcePurgeJail mirrors ForcePurgeVM exactly, for a jail tombstoned
  // by DeleteJail whose owning node will never come back to reconcile
  // it away. See ForcePurgeVM's own doc comment above for the full
  // reasoning - it applies identically here.
  rpc ForcePurgeJail(ForcePurgeJailRequest) returns (ForcePurgeJailResponse);

  // SimulateNodeFailure is a read-only "what happens if this node
  // disappears right now" report (ADR-0052, the Dependency Graph
  // Simulator's v1 slice) - not fault injection, nothing is changed.
  // It combines three separate sequential reads (VM list, jail list,
  // raft status) plus live per-remaining-voter reachability checks -
  // not an atomic snapshot; a concurrent cluster change, or a peer
  // becoming reachable/unreachable between checks, could be reflected
  // in one part of the response and not another. Like GetVM/ListVMs,
  // this needs the current leader's own FSM view of VM/jail ownership,
  // so it only succeeds against the current leader; the entire request
  // (not just the failed sub-call) is forwarded on a leader-hint
  // rejection so the report never mixes two different nodes' views.
  // node_id not recognized by raft membership or by any VM/jail's
  // node_id/replica_node_id returns error set, never a misleadingly
  // empty-looking "safe" report.
  rpc SimulateNodeFailure(SimulateNodeFailureRequest) returns (SimulateNodeFailureResponse);

  // MigrateJail mirrors MigrateVM exactly, for jails instead of VMs -
  // see MigrateVM's own doc comment above for the full reasoning
  // (including the "target must already be a synced HAST replica"
  // safety requirement), which applies identically here.
  rpc MigrateJail(MigrateJailRequest) returns (MigrateJailResponse);

  // ReportVMPhase/ReportVMTeardownComplete/ReportJailPhase/
  // ReportJailTeardownComplete are peer-to-peer RPCs, not meant for
  // human/API-client use: a reconciler on a node that owns a VM/jail
  // but whose own raftd isn't the current raft leader calls these on
  // the LEADER node's managerd instead, since only the leader's own
  // raftd can ever accept an Apply (ADR-0029) - raftd's internal API
  // stays Unix-socket-only, never exposed over the network; this
  // reuses ManagerService's existing, already-networked, already-
  // optionally-API-key-gated external surface instead of opening a
  // new one. Gated by the same auth as every other RPC here when
  // enabled - see cmd/managerd's -peer-api-key flag.
  rpc ReportVMPhase(ReportVMPhaseRequest) returns (ReportVMPhaseResponse);
  rpc ReportVMTeardownComplete(ReportVMTeardownCompleteRequest) returns (ReportVMTeardownCompleteResponse);
  rpc ReportJailPhase(ReportJailPhaseRequest) returns (ReportJailPhaseResponse);
  rpc ReportJailTeardownComplete(ReportJailTeardownCompleteRequest) returns (ReportJailTeardownCompleteResponse);

  // PushISOTo is the peer-to-peer half of on-demand image fetching
  // (ADR-0041, superseding ADR-0040's browser-triggered ReplicateISO):
  // the *source* node's own managerd calls UploadISO against
  // target_node_id itself, the same way a browser upload would, in
  // response to a peer (usually a reconciler discovering it's missing
  // an ISO/base image a VM names) asking it to push a file it already
  // has. Peer-only, mirrors the Report* RPCs' own reasoning above
  // exactly - never meant for direct human/API-client use.
  rpc PushISOTo(PushISOToRequest) returns (PushISOToResponse);
}

// VMState mirrors api/internalpb's VMState. Kept as a separate type
// (rather than reusing the internal package's) so the external schema
// doesn't couple to the internal protocol's evolution - the same
// reasoning ADR-0002 applied to StatusResponse.
enum VMState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_STOPPED = 1;
  VM_STATE_RUNNING = 2;

  // VM_STATE_DELETING means the VM has been requested for deletion and
  // its owning node's reconciler is (or will be) tearing down its real
  // resources - see ADR-0016. The record disappears from ListVMs once
  // that completes.
  VM_STATE_DELETING = 3;
}

// VMPhase mirrors api/internalpb's VMPhase: the reconciler's own observed
// progress toward a VM's desired state, as opposed to desired_state
// (which is only ever what a caller asked for).
enum VMPhase {
  VM_PHASE_UNSPECIFIED = 0;
  VM_PHASE_CREATING = 1;
  VM_PHASE_READY = 2;
  VM_PHASE_DELETING = 3;
  VM_PHASE_ERROR = 4;
}

message VMDefinition {
  string id = 1;
  string name = 2;
  uint32 vcpus = 3;
  uint64 memory_mb = 4;
  string node_id = 5;
  VMState desired_state = 6;
  VMPhase phase = 7;
  string phase_error = 8;

  // iso_name, if set, names an image already uploaded via UploadISO on
  // the assigned node - the reconciler resolves it to a local path and
  // attaches it as a CD-ROM device. Empty means no installer image
  // (the VM's disk is used as-is).
  string iso_name = 9;

  // network_id, if set, names a network (see NetworkDefinition below)
  // this VM's NIC belongs to. Empty means the flat single-bridge
  // behavior from before network management existed. See ADR-0022.
  string network_id = 10;

  // ip_address/mac_address are assigned automatically when network_id
  // is set (never by the caller) - read-only, reported back for
  // display. Both empty when network_id is empty.
  string ip_address = 11;
  string mac_address = 12;

  // firewall_rules is a simple allow/block list applied to this VM's
  // traffic via a per-VM pf(8) anchor. No rules means everything
  // allowed (today's de facto behavior, unaffected for existing VMs).
  repeated FirewallRule firewall_rules = 13;

  // replica_node_id, if set, names a second cluster node that
  // replicates this VM's disk via HAST (ADR-0025) - real-time block
  // replication for data redundancy, not automatic failover. Caller-set,
  // exactly like node_id. Empty means the unreplicated disk path from
  // before this existed.
  string replica_node_id = 14;

  // base_image_name, if set, names a raw disk image already uploaded
  // via UploadISO (reusing internal/isostore) on the assigned node -
  // the reconciler seeds this VM's disk file from it on first creation
  // instead of creating a blank file. See ADR-0031. Empty means today's
  // behavior (a blank disk).
  string base_image_name = 15;

  // firewall_paused, when true, means firewall_rules are temporarily
  // not enforced for this VM (everything allowed) without discarding
  // them - set only via SetVMFirewallPaused, never via UpdateVM. See
  // ADR-0049.
  bool firewall_paused = 16;
}

// JailState mirrors api/internalpb's JailState.
enum JailState {
  JAIL_STATE_UNSPECIFIED = 0;
  JAIL_STATE_STOPPED = 1;
  JAIL_STATE_RUNNING = 2;
  JAIL_STATE_DELETING = 3;
}

// JailPhase mirrors api/internalpb's JailPhase.
enum JailPhase {
  JAIL_PHASE_UNSPECIFIED = 0;
  JAIL_PHASE_CREATING = 1;
  JAIL_PHASE_READY = 2;
  JAIL_PHASE_DELETING = 3;
  JAIL_PHASE_ERROR = 4;
}

// JailDefinition mirrors api/internalpb's JailDefinition, deliberately
// minimal like its internal counterpart - see ADR-0026.
message JailDefinition {
  string id = 1;
  string name = 2;
  string hostname = 3;
  string node_id = 4;

  // replica_node_id, if set, names a second cluster node that
  // replicates this jail's root filesystem via HAST (ADR-0026) -
  // the same data-redundancy-not-failover semantics as
  // VMDefinition.replica_node_id.
  string replica_node_id = 5;

  JailState desired_state = 6;
  JailPhase phase = 7;
  string phase_error = 8;
}

// FirewallRule mirrors api/internalpb's FirewallRule.
message FirewallRule {
  string direction = 1;  // "in" or "out"
  string action = 2;     // "pass" or "block"
  string protocol = 3;   // "tcp", "udp", "icmp", or "" (any)
  string port_range = 4; // "22", "8000-9000", or "" (any)
}

// NetworkDefinition mirrors api/internalpb's NetworkDefinition - a
// named, cluster-wide L2 segment VMs can attach to. See ADR-0022.
message NetworkDefinition {
  string id = 1;
  string name = 2;
  uint32 vlan_id = 3;     // 0 = untagged
  string subnet = 4;      // CIDR, e.g. "10.60.0.0/24"
  string bridge_name = 5; // optional override; derived if empty

  // bridge_status is physical, per-node state ("up", "down", or
  // "unknown" if this node has no VLAN support configured or the
  // bridge doesn't exist here yet) - populated only by ListNetworks,
  // never stored and never meaningful on Create/Delete requests or
  // responses.
  string bridge_status = 6;

  // external_gateway, if set, is a real router's address already
  // serving this subnet - see api/internalpb/state.proto's
  // NetworkDefinition.external_gateway for the full explanation. Empty
  // (the default) preserves today's behavior: Apiary's own per-node
  // bridge is the gateway.
  string external_gateway = 7;
}

message CreateVMRequest {
  VMDefinition vm = 1;
  uint32 timeout_ms = 2;
}

message CreateVMResponse {
  VMDefinition vm = 1;
  string error = 2;
  string leader_hint = 3;
}

message UpdateVMRequest {
  VMDefinition vm = 1;
  uint32 timeout_ms = 2;
}

message UpdateVMResponse {
  VMDefinition vm = 1;
  string error = 2;
  string leader_hint = 3;
}

message DeleteVMRequest {
  string id = 1;
  uint32 timeout_ms = 2;
}

message DeleteVMResponse {
  // vm is the definition that was deleted, echoed back for confirmation.
  VMDefinition vm = 1;
  string error = 2;
  string leader_hint = 3;
}

message ForcePurgeVMRequest {
  string id = 1;
  uint32 timeout_ms = 2;
}

message ForcePurgeVMResponse {
  // vm is the definition that was purged, echoed back for confirmation.
  VMDefinition vm = 1;

  // error is set if the VM doesn't exist, or exists but isn't in
  // VM_STATE_DELETING yet (call DeleteVM first).
  string error = 2;
  string leader_hint = 3;
}

message MigrateVMRequest {
  string id = 1;
  string target_node_id = 2;
  uint32 timeout_ms = 3;
}

message MigrateVMResponse {
  // vm is the updated definition, echoed back for confirmation.
  VMDefinition vm = 1;

  // error is set if the VM doesn't exist, is marked for deletion, or
  // target_node_id isn't already this VM's replica_node_id - see
  // MigrateVM's own doc comment for why that last check exists.
  string error = 2;
  string leader_hint = 3;
}

message SetVMFirewallPausedRequest {
  string id = 1;
  bool paused = 2;
  uint32 timeout_ms = 3;
}

message SetVMFirewallPausedResponse {
  // vm is the updated definition, echoed back for confirmation.
  VMDefinition vm = 1;
  string error = 2;
  string leader_hint = 3;
}

message GetVMRequest {
  string id = 1;
}

message GetVMResponse {
  VMDefinition vm = 1;
  bool found = 2;
  string error = 3;
  string leader_hint = 4;
}

message ListVMsRequest {}

message ListVMsResponse {
  repeated VMDefinition vms = 1;
  string error = 2;
  string leader_hint = 3;
}

message StatusRequest {}

message StatusResponse {
  // manager_node_id identifies this managerd instance. It may differ from
  // the raft node ID it talks to.
  string manager_node_id = 1;

  // raft_reachable is false if managerd could not reach raftd over the
  // internal socket for this request; raft_error explains why, and the
  // remaining raft_* fields are left at their zero values.
  bool raft_reachable = 2;
  string raft_error = 3;

  bool raft_is_leader = 4;
  string raft_leader_id = 5;
  string raft_node_id = 6;
  uint64 raft_last_log_index = 7;
  uint64 raft_applied_index = 8;
  string raft_state = 9;

  // known_node_ids lists the IDs of raft cluster members, as known to
  // this node's raftd. Useful for clients (e.g. the web UI) that need to
  // offer a choice of nodes without a separate scheduling component.
  repeated string known_node_ids = 10;
}

// UploadISORequest is one message in the UploadISO client stream.
// Exactly one metadata message must come first, followed by one or
// more chunk messages carrying the file's bytes in order.
message UploadISORequest {
  oneof data {
    ISOUploadMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message ISOUploadMetadata {
  string name = 1;

  // expected_sha256 is required (see ADR-0017) - an upload with no hash
  // to verify against is exactly the failure mode this API exists to
  // prevent.
  string expected_sha256 = 2;
}

message UploadISOResponse {
  string name = 1;
  uint64 size_bytes = 2;
  string sha256 = 3;

  // error is set (with name/size_bytes/sha256 left at zero values) if
  // the upload was rejected - most commonly a hash mismatch.
  string error = 4;
}

message ListISOsRequest {}

message ISOInfo {
  string name = 1;
  uint64 size_bytes = 2;
  string sha256 = 3;
}

message ListISOsResponse {
  repeated ISOInfo isos = 1;
  string error = 2;
}

message DeleteISORequest {
  string name = 1;
}

message DeleteISOResponse {
  string error = 1;
}

message PushISOToRequest {
  string name = 1;
  string target_node_id = 2;
}

message PushISOToResponse {
  string error = 1;
}

message HostStatsRequest {}

message CPUStats {
  int32 cores = 1;
  double load_avg_1 = 2;
  double load_avg_5 = 3;
  double load_avg_15 = 4;
}

message MemStats {
  uint64 total_bytes = 1;
  uint64 free_bytes = 2;
}

message PoolStats {
  string name = 1;
  uint64 size_bytes = 2;
  uint64 alloc_bytes = 3;
  uint64 free_bytes = 4;
  uint32 capacity_pct = 5;
  string health = 6;
}

message DiskStats {
  string name = 1;
  string model = 2;
  string serial = 3;
  bool healthy = 4;

  // error is set if the SMART query for this disk failed - healthy is
  // meaningless in that case, not a false "known bad" signal.
  string error = 5;
}

message NetIfaceStats {
  string name = 1;

  // rx_bytes/tx_bytes are cumulative counters since boot, not a rate -
  // see internal/hoststats.NetIface's doc comment (ADR-0018).
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;

  // up is this interface's real current state (ifconfig's own UP
  // flag) - see ADR-0022.
  bool up = 4;
}

// PFStats summarizes pf(8)'s current status, from `pfctl -s info` -
// confirming the firewall (ADR-0022's per-VM rules) is actually enabled
// and seeing traffic.
message PFStats {
  bool enabled = 1;
  uint64 current_states = 2;
  uint64 matches = 3;
}

message HostStatsResponse {
  string node_id = 1;
  CPUStats cpu = 2;
  MemStats mem = 3;
  repeated PoolStats pools = 4;
  repeated DiskStats disks = 5;
  repeated NetIfaceStats net = 6;

  // errors lists any subsystem that failed to report (see
  // hoststats.Snapshot.Errors) - the rest of the response is still
  // populated on a best-effort basis.
  repeated string errors = 7;

  PFStats pf = 8;
}

message GetVMConsoleRequest {
  string id = 1;
}

message GetVMConsoleResponse {
  // host/port identify the VNC TCP listener to connect to -
  // internal/frontend proxies its noVNC WebSocket console through this,
  // never exposing it directly to the browser. host is always "127.0.0.1"
  // (never the node's own hostname/ID): GetVMConsole only ever answers
  // for a VM confirmed to be running on *this* node, and the caller
  // (internal/frontend) is only ever expected to run alongside that same
  // managerd - matching how -manager-addr already defaults to
  // 127.0.0.1:17700. A node's own hostname isn't guaranteed to resolve
  // from itself (confirmed live on apiarium), so loopback avoids a DNS
  // dependency this has no other reason to require. A real multi-node
  // deployment, where the frontend querying GetVMConsole isn't
  // necessarily colocated with the VM's owning node, would need real
  // node-address discovery, which doesn't exist yet (the same gap
  // already noted for node scheduling).
  string host = 1;
  uint32 port = 2;

  // available is false (with host/port left at zero values) if the VM
  // isn't running with VNC on this node - not yet reconciled, running on
  // a different node, or created before VNC support existed.
  bool available = 3;

  string error = 4;
}

message GetVMSerialLogRequest {
  string id = 1;

  // max_bytes caps how much of the log's tail is returned; 0 uses a
  // server-side default. Bounded server-side regardless of what's
  // requested - a runaway VM's log can grow to many megabytes in
  // minutes (seen live), and this is a plain synchronous RPC, not a
  // stream, so an unbounded read isn't safe to offer at all.
  uint32 max_bytes = 2;
}

message GetVMSerialLogResponse {
  // content is the tail of the log file, as UTF-8 text (best-effort -
  // a serial console can emit non-UTF-8 bytes, e.g. mid-escape-sequence
  // at the point the tail window starts; invalid sequences are replaced
  // rather than erroring the whole response).
  string content = 1;

  // truncated is true if content was cut short by max_bytes/the
  // server-side cap rather than being the log's entire (small) content.
  bool truncated = 2;

  // available is false (with content left empty) if the VM isn't
  // running with serial logging on this node - not yet reconciled,
  // running on a different node, or created before serial logging
  // existed (ADR-0032).
  bool available = 3;

  string error = 4;
}

message GetNodeConfigRequest {}

message GetNodeConfigResponse {
  // uplink is the physical interface VLAN-tagged networks attach to
  // (mirrors -vlan-uplink) - empty if never set.
  string uplink = 1;

  // nat_uplink is the interface a self-hosted network's outbound NAT
  // egresses through (mirrors -nat-uplink, see ADR-0048) - empty means
  // it falls back to uplink's own value.
  string nat_uplink = 2;

  string error = 3;
}

message UpdateNodeConfigRequest {
  string uplink = 1;
  string nat_uplink = 2;
}

message UpdateNodeConfigResponse {
  // error is set if the new settings couldn't be persisted. A
  // successful response does not mean the change is live yet - see
  // GetNodeConfig/UpdateNodeConfig's own doc comment in the service
  // definition above: it takes effect on this node's next managerd
  // restart.
  string error = 1;
}

message SetDatasetQuotaRequest {
  // dataset_name is relative to this node's own configured ZFS Base
  // (e.g. a VM or jail id) - never an absolute path. See ADR-0049 for
  // why the Base dataset itself can't be targeted directly.
  string dataset_name = 1;

  // quota is passed through to `zfs set quota=<quota>` as-is (e.g.
  // "10G", or "none" to clear) - zfs(8) validates the value itself.
  string quota = 2;
}

message SetDatasetQuotaResponse {
  string error = 1;
}

