syntax = "proto3";

package apiary.rpc.v1;

option go_package = "github.com/glenjbarber/apiary/api/rpc;rpcpb";

// ManagerService is the external RPC API exposed by managerd.
// CreateVM/UpdateVM/DeleteVM record ephemeral VM definitions via raftd -
// there is still no bhyve/jail/zfs backend, so nothing actually runs a VM
// yet, but the definitions are real, replicated, and persisted.
service ManagerService {
  rpc Status(StatusRequest) returns (StatusResponse);

  rpc CreateVM(CreateVMRequest) returns (CreateVMResponse);
  rpc UpdateVM(UpdateVMRequest) returns (UpdateVMResponse);
  rpc DeleteVM(DeleteVMRequest) returns (DeleteVMResponse);

  // ForcePurgeVM is an escape hatch for a VM tombstoned by DeleteVM
  // whose owning node will never reconcile it away (permanently
  // offline/decommissioned) - see CLAUDE.md's "What's not implemented
  // yet" note on resource reclaim. It only succeeds against a VM
  // already in VM_STATE_DELETING (call DeleteVM first) and removes the
  // record outright, the same way the owning node's own reconciler
  // would via PurgeVM - but it does NOT touch that node's real ZFS
  // dataset or bhyve VM, since (by definition, this being needed at
  // all) that node can't be reached. Use only when the owning node is
  // confirmed gone for good; otherwise its resources are silently
  // orphaned with no record left to indicate they exist.
  rpc ForcePurgeVM(ForcePurgeVMRequest) returns (ForcePurgeVMResponse);

  // GetVM and ListVMs only succeed against the current leader - see
  // api/internalpb/raftd.proto's GetVM/ListVMs doc comments for why v1's
  // read consistency model is deliberately as simple as its write model.
  rpc GetVM(GetVMRequest) returns (GetVMResponse);
  rpc ListVMs(ListVMsRequest) returns (ListVMsResponse);

  // UploadISO, ListISOs, and DeleteISO manage installer images stored
  // locally on *this* managerd's own node - unlike VM definitions,
  // these are physical data (see CLAUDE.md's physical/ephemeral
  // distinction) and are never replicated through raft. UploadISO is
  // client-streaming so a large image doesn't have to fit in one
  // message; see ADR-0017 for why verification happens server-side
  // rather than trusting a client-computed hash.
  rpc UploadISO(stream UploadISORequest) returns (UploadISOResponse);
  rpc ListISOs(ListISOsRequest) returns (ListISOsResponse);
  rpc DeleteISO(DeleteISORequest) returns (DeleteISOResponse);

  // HostStats reports a point-in-time snapshot of *this* node's own
  // resource usage and hardware health - physical, per-node data like
  // ISOs above, gathered locally by managerd (see internal/hoststats),
  // never routed through raft.
  rpc HostStats(HostStatsRequest) returns (HostStatsResponse);

  // GetVMConsole reports how to reach a running VM's VNC framebuffer,
  // for the web UI's noVNC-based console page (ADR-0020). Like HostStats,
  // this only answers for a VM actually running on *this* node - see
  // GetVMConsoleResponse's doc comment for the v1 limitation that
  // follows from that.
  rpc GetVMConsole(GetVMConsoleRequest) returns (GetVMConsoleResponse);

  // CreateNetwork/ListNetworks/DeleteNetwork manage NetworkDefinitions -
  // VLAN/subnet/bridge segments a VM can attach to (see ADR-0022).
  // CreateNetwork/DeleteNetwork just submit a Command through raft
  // (like CreateVM/DeleteVM); ListNetworks reads current state, subject
  // to the same leader-only requirement as ListVMs.
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse);
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);
  rpc DeleteNetwork(DeleteNetworkRequest) returns (DeleteNetworkResponse);

  // CreateAPIKey/ListAPIKeys/RevokeAPIKey manage credentials for this
  // service's own RPC surface (ADR-0023). CreateAPIKey is the only
  // place a raw key is ever returned - it cannot be retrieved again
  // after this response. Once at least one key exists, every RPC on
  // this service (including these three) requires a valid one; before
  // that, everything remains open, matching this project's behavior
  // today.
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
}

// VMState mirrors api/internalpb's VMState. Kept as a separate type
// (rather than reusing the internal package's) so the external schema
// doesn't couple to the internal protocol's evolution - the same
// reasoning ADR-0002 applied to StatusResponse.
enum VMState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_STOPPED = 1;
  VM_STATE_RUNNING = 2;

  // VM_STATE_DELETING means the VM has been requested for deletion and
  // its owning node's reconciler is (or will be) tearing down its real
  // resources - see ADR-0016. The record disappears from ListVMs once
  // that completes.
  VM_STATE_DELETING = 3;
}

// VMPhase mirrors api/internalpb's VMPhase: the reconciler's own observed
// progress toward a VM's desired state, as opposed to desired_state
// (which is only ever what a caller asked for).
enum VMPhase {
  VM_PHASE_UNSPECIFIED = 0;
  VM_PHASE_CREATING = 1;
  VM_PHASE_READY = 2;
  VM_PHASE_DELETING = 3;
  VM_PHASE_ERROR = 4;
}

message VMDefinition {
  string id = 1;
  string name = 2;
  uint32 vcpus = 3;
  uint64 memory_mb = 4;
  string node_id = 5;
  VMState desired_state = 6;
  VMPhase phase = 7;
  string phase_error = 8;

  // iso_name, if set, names an image already uploaded via UploadISO on
  // the assigned node - the reconciler resolves it to a local path and
  // attaches it as a CD-ROM device. Empty means no installer image
  // (the VM's disk is used as-is).
  string iso_name = 9;

  // network_id, if set, names a network (see NetworkDefinition below)
  // this VM's NIC belongs to. Empty means the flat single-bridge
  // behavior from before network management existed. See ADR-0022.
  string network_id = 10;

  // ip_address/mac_address are assigned automatically when network_id
  // is set (never by the caller) - read-only, reported back for
  // display. Both empty when network_id is empty.
  string ip_address = 11;
  string mac_address = 12;

  // firewall_rules is a simple allow/block list applied to this VM's
  // traffic via a per-VM pf(8) anchor. No rules means everything
  // allowed (today's de facto behavior, unaffected for existing VMs).
  repeated FirewallRule firewall_rules = 13;

  // replica_node_id, if set, names a second cluster node that
  // replicates this VM's disk via HAST (ADR-0025) - real-time block
  // replication for data redundancy, not automatic failover. Caller-set,
  // exactly like node_id. Empty means the unreplicated disk path from
  // before this existed.
  string replica_node_id = 14;
}

// FirewallRule mirrors api/internalpb's FirewallRule.
message FirewallRule {
  string direction = 1;  // "in" or "out"
  string action = 2;     // "pass" or "block"
  string protocol = 3;   // "tcp", "udp", "icmp", or "" (any)
  string port_range = 4; // "22", "8000-9000", or "" (any)
}

// NetworkDefinition mirrors api/internalpb's NetworkDefinition - a
// named, cluster-wide L2 segment VMs can attach to. See ADR-0022.
message NetworkDefinition {
  string id = 1;
  string name = 2;
  uint32 vlan_id = 3;     // 0 = untagged
  string subnet = 4;      // CIDR, e.g. "10.60.0.0/24"
  string bridge_name = 5; // optional override; derived if empty

  // bridge_status is physical, per-node state ("up", "down", or
  // "unknown" if this node has no VLAN support configured or the
  // bridge doesn't exist here yet) - populated only by ListNetworks,
  // never stored and never meaningful on Create/Delete requests or
  // responses.
  string bridge_status = 6;
}

message CreateVMRequest {
  VMDefinition vm = 1;
  uint32 timeout_ms = 2;
}

message CreateVMResponse {
  VMDefinition vm = 1;
  string error = 2;
  string leader_hint = 3;
}

message UpdateVMRequest {
  VMDefinition vm = 1;
  uint32 timeout_ms = 2;
}

message UpdateVMResponse {
  VMDefinition vm = 1;
  string error = 2;
  string leader_hint = 3;
}

message DeleteVMRequest {
  string id = 1;
  uint32 timeout_ms = 2;
}

message DeleteVMResponse {
  // vm is the definition that was deleted, echoed back for confirmation.
  VMDefinition vm = 1;
  string error = 2;
  string leader_hint = 3;
}

message ForcePurgeVMRequest {
  string id = 1;
  uint32 timeout_ms = 2;
}

message ForcePurgeVMResponse {
  // vm is the definition that was purged, echoed back for confirmation.
  VMDefinition vm = 1;

  // error is set if the VM doesn't exist, or exists but isn't in
  // VM_STATE_DELETING yet (call DeleteVM first).
  string error = 2;
  string leader_hint = 3;
}

message GetVMRequest {
  string id = 1;
}

message GetVMResponse {
  VMDefinition vm = 1;
  bool found = 2;
  string error = 3;
  string leader_hint = 4;
}

message ListVMsRequest {}

message ListVMsResponse {
  repeated VMDefinition vms = 1;
  string error = 2;
  string leader_hint = 3;
}

message StatusRequest {}

message StatusResponse {
  // manager_node_id identifies this managerd instance. It may differ from
  // the raft node ID it talks to.
  string manager_node_id = 1;

  // raft_reachable is false if managerd could not reach raftd over the
  // internal socket for this request; raft_error explains why, and the
  // remaining raft_* fields are left at their zero values.
  bool raft_reachable = 2;
  string raft_error = 3;

  bool raft_is_leader = 4;
  string raft_leader_id = 5;
  string raft_node_id = 6;
  uint64 raft_last_log_index = 7;
  uint64 raft_applied_index = 8;
  string raft_state = 9;

  // known_node_ids lists the IDs of raft cluster members, as known to
  // this node's raftd. Useful for clients (e.g. the web UI) that need to
  // offer a choice of nodes without a separate scheduling component.
  repeated string known_node_ids = 10;
}

// UploadISORequest is one message in the UploadISO client stream.
// Exactly one metadata message must come first, followed by one or
// more chunk messages carrying the file's bytes in order.
message UploadISORequest {
  oneof data {
    ISOUploadMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message ISOUploadMetadata {
  string name = 1;

  // expected_sha256 is required (see ADR-0017) - an upload with no hash
  // to verify against is exactly the failure mode this API exists to
  // prevent.
  string expected_sha256 = 2;
}

message UploadISOResponse {
  string name = 1;
  uint64 size_bytes = 2;
  string sha256 = 3;

  // error is set (with name/size_bytes/sha256 left at zero values) if
  // the upload was rejected - most commonly a hash mismatch.
  string error = 4;
}

message ListISOsRequest {}

message ISOInfo {
  string name = 1;
  uint64 size_bytes = 2;
  string sha256 = 3;
}

message ListISOsResponse {
  repeated ISOInfo isos = 1;
  string error = 2;
}

message DeleteISORequest {
  string name = 1;
}

message DeleteISOResponse {
  string error = 1;
}

message HostStatsRequest {}

message CPUStats {
  int32 cores = 1;
  double load_avg_1 = 2;
  double load_avg_5 = 3;
  double load_avg_15 = 4;
}

message MemStats {
  uint64 total_bytes = 1;
  uint64 free_bytes = 2;
}

message PoolStats {
  string name = 1;
  uint64 size_bytes = 2;
  uint64 alloc_bytes = 3;
  uint64 free_bytes = 4;
  uint32 capacity_pct = 5;
  string health = 6;
}

message DiskStats {
  string name = 1;
  string model = 2;
  string serial = 3;
  bool healthy = 4;

  // error is set if the SMART query for this disk failed - healthy is
  // meaningless in that case, not a false "known bad" signal.
  string error = 5;
}

message NetIfaceStats {
  string name = 1;

  // rx_bytes/tx_bytes are cumulative counters since boot, not a rate -
  // see internal/hoststats.NetIface's doc comment (ADR-0018).
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;

  // up is this interface's real current state (ifconfig's own UP
  // flag) - see ADR-0022.
  bool up = 4;
}

// PFStats summarizes pf(8)'s current status, from `pfctl -s info` -
// confirming the firewall (ADR-0022's per-VM rules) is actually enabled
// and seeing traffic.
message PFStats {
  bool enabled = 1;
  uint64 current_states = 2;
  uint64 matches = 3;
}

message HostStatsResponse {
  string node_id = 1;
  CPUStats cpu = 2;
  MemStats mem = 3;
  repeated PoolStats pools = 4;
  repeated DiskStats disks = 5;
  repeated NetIfaceStats net = 6;

  // errors lists any subsystem that failed to report (see
  // hoststats.Snapshot.Errors) - the rest of the response is still
  // populated on a best-effort basis.
  repeated string errors = 7;

  PFStats pf = 8;
}

message GetVMConsoleRequest {
  string id = 1;
}

message GetVMConsoleResponse {
  // host/port identify the VNC TCP listener to connect to -
  // internal/frontend proxies its noVNC WebSocket console through this,
  // never exposing it directly to the browser. host is always "127.0.0.1"
  // (never the node's own hostname/ID): GetVMConsole only ever answers
  // for a VM confirmed to be running on *this* node, and the caller
  // (internal/frontend) is only ever expected to run alongside that same
  // managerd - matching how -manager-addr already defaults to
  // 127.0.0.1:17700. A node's own hostname isn't guaranteed to resolve
  // from itself (confirmed live on apiarium), so loopback avoids a DNS
  // dependency this has no other reason to require. A real multi-node
  // deployment, where the frontend querying GetVMConsole isn't
  // necessarily colocated with the VM's owning node, would need real
  // node-address discovery, which doesn't exist yet (the same gap
  // already noted for node scheduling).
  string host = 1;
  uint32 port = 2;

  // available is false (with host/port left at zero values) if the VM
  // isn't running with VNC on this node - not yet reconciled, running on
  // a different node, or created before VNC support existed.
  bool available = 3;

  string error = 4;
}

message CreateNetworkRequest {
  NetworkDefinition network = 1;
  uint32 timeout_ms = 2;
}

message CreateNetworkResponse {
  NetworkDefinition network = 1;
  string error = 2;
  string leader_hint = 3;
}

message ListNetworksRequest {}

message ListNetworksResponse {
  repeated NetworkDefinition networks = 1;
  string error = 2;
  string leader_hint = 3;
}

message DeleteNetworkRequest {
  string id = 1;
  uint32 timeout_ms = 2;
}

message DeleteNetworkResponse {
  NetworkDefinition network = 1;
  string error = 2;
  string leader_hint = 3;
}

// APIKeyInfo is a key's metadata only - it never carries the raw key
// or its hash, so a hash can never leak back out over this API even
// by accident (see ADR-0023).
message APIKeyInfo {
  string id = 1;
  string name = 2;
  int64 created_unix = 3;
}

message CreateAPIKeyRequest {
  string name = 1;
  uint32 timeout_ms = 2;
}

message CreateAPIKeyResponse {
  APIKeyInfo key = 1;

  // raw_key is the actual credential, shown exactly once - it is
  // never stored anywhere (only its hash is) and can never be
  // retrieved again after this response.
  string raw_key = 2;

  string error = 3;
  string leader_hint = 4;
}

message ListAPIKeysRequest {}

message ListAPIKeysResponse {
  repeated APIKeyInfo keys = 1;
  string error = 2;
  string leader_hint = 3;
}

message RevokeAPIKeyRequest {
  string id = 1;
  uint32 timeout_ms = 2;
}

message RevokeAPIKeyResponse {
  string error = 1;
  string leader_hint = 2;
}
