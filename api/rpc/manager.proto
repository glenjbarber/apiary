  string leader_hint = 2;
}

// SimulateNodeFailureRequest/Response and the messages/enums below back
// SimulateNodeFailure (ADR-0052). See that RPC's own doc comment for
// the non-atomicity/leader-forwarding caveats.
message SimulateNodeFailureRequest {
  string node_id = 1;
}

message SimulateNodeFailureResponse {
  // error is set both for a real RPC failure and for a node_id
  // unrecognized by raft membership or any VM/jail placement - a
  // populated quorum/owned_resources/replica_backed_resources payload
  // only ever accompanies an empty error.
  string error = 1;
  string leader_hint = 2;
  QuorumImpact quorum = 3;
  repeated OwnedResourceImpact owned_resources = 4;
  repeated ReplicaBackedImpact replica_backed_resources = 5;
  repeated ImageAvailabilityImpact image_availability = 6;
}

message QuorumImpact {
  bool target_is_voter = 1;
  uint32 total_voters = 2;

  // remaining_voters is the configured voter count after removing the
  // target, ignoring live reachability entirely.
  uint32 remaining_voters = 3;

  // remaining_reachable_voters is, of those, how many responded to a
  // live reachability check just now. survives is computed from this
  // count, not remaining_voters - a raft configuration can look
  // survivable by pure arithmetic while actually failing right now if
  // one of the "remaining" voters is already unreachable.
  uint32 remaining_reachable_voters = 4;

  // remaining_unknown_voters counts remaining voters whose reachability
  // could not be verified at all (e.g. no peer forwarding configured on
  // the answering node) - never silently folded into either
  // remaining_reachable_voters or a lost verdict.
  uint32 remaining_unknown_voters = 5;

  uint32 quorum_size = 6;
  bool survives = 7;
  string note = 8;
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_VM = 1;
  RESOURCE_KIND_JAIL = 2;
}

// RecoveryVerdict is deliberately limited to what raft configuration
// data and node_id/replica_node_id placement alone can prove - see
// ADR-0052 for why there is no "will recover cleanly" verdict in v1
// (live HAST sync status has no RPC exposure anywhere in this
// codebase).
enum RecoveryVerdict {
  RECOVERY_VERDICT_UNSPECIFIED = 0;

  // RECOVERY_VERDICT_UNPROTECTED: no replica_node_id configured - this
  // proves only the absence of HAST-based redundancy Apiary knows
  // about, not that the resource's data is permanently unrecoverable
  // by any means.
  RECOVERY_VERDICT_UNPROTECTED = 1;

  // RECOVERY_VERDICT_UNVERIFIED_REPLICA: replica_node_id is set, but
  // this RPC does not query live HAST sync status - the replica may or
  // may not actually be caught up.
  RECOVERY_VERDICT_UNVERIFIED_REPLICA = 2;
}

message OwnedResourceImpact {
  string id = 1;
  string name = 2;
  ResourceKind kind = 3;
  string replica_node_id = 4;
  RecoveryVerdict verdict = 5;
  string explanation = 6;
}

// ReplicaBackedImpact is a resource actually owned by a DIFFERENT node,
// for which the simulated node is the configured HAST replica target.
// It keeps running unaffected on its real owner if the simulated node
// disappears, but loses its redundancy until a new replica is
// configured elsewhere - a real, distinct consequence from anything in
// owned_resources above.
message ReplicaBackedImpact {
  string id = 1;
  string name = 2;
  ResourceKind kind = 3;
  string owner_node_id = 4;
  string explanation = 5;
}

message SimulateNetworkFailureRequest {
  string network_id = 1;
}

message SimulateNetworkFailureResponse {
  string error = 1;
  string leader_hint = 2;
  NetworkDefinition network = 3;
  repeated NetworkFailureImpact affected_resources = 4;
  string note = 5;
}

// PathTraceStatus is evidence-aware: UNKNOWN means Apiary lacks enough
// current evidence, while NOT_APPLICABLE means the step was intentionally
// not tested or is outside this path.
enum PathTraceStatus {
  PATH_TRACE_STATUS_UNSPECIFIED = 0;
  PATH_TRACE_STATUS_CLEAR = 1;
  PATH_TRACE_STATUS_BLOCKED = 2;
  PATH_TRACE_STATUS_UNKNOWN = 3;
  PATH_TRACE_STATUS_NOT_APPLICABLE = 4;
}

message TraceCellPathRequest {
  string cell_id = 1;
  string destination = 2;
  string protocol = 3; // "tcp", "udp", "icmp", or empty
  uint32 port = 4;     // only with tcp/udp; 0 means unspecified
}

message PathTraceStep {
  string stage = 1;
  PathTraceStatus status = 2;
  string summary = 3;
  string evidence = 4;
  string explanation = 5;
}

message TraceCellPathResponse {
  string error = 1;
  string leader_hint = 2;
  VMDefinition cell = 3;
  NetworkDefinition network = 4;
  PathTraceStatus status = 5;
  string summary = 6;
  repeated PathTraceStep steps = 7;
  bool non_atomic = 8;
  bool active_probe = 9;
}

message NetworkFailureImpact {
  string id = 1;
  string name = 2;
  string node_id = 3;
  string explanation = 4;
}

enum ImageRole {
  IMAGE_ROLE_UNSPECIFIED = 0;
  IMAGE_ROLE_ISO = 1;
  IMAGE_ROLE_BASE_IMAGE = 2;
}

enum ImageAvailabilityVerdict {
  IMAGE_AVAILABILITY_VERDICT_UNSPECIFIED = 0;
  IMAGE_AVAILABILITY_VERDICT_AVAILABLE = 1;
  IMAGE_AVAILABILITY_VERDICT_UNAVAILABLE = 2;
  IMAGE_AVAILABILITY_VERDICT_UNKNOWN = 3;
}

message ImageAvailabilityImpact {
  string resource_id = 1;
  string resource_name = 2;
  string image_name = 3;
  ImageRole role = 4;
  ImageAvailabilityVerdict verdict = 5;
  repeated string source_nodes = 6;
  repeated string unknown_nodes = 7;
  string explanation = 8;
}

// --- Automated Assumption Checks (ADR-0055) ---
//
// This is a scoped precursor to CODEX.md's fuller "Assumption Register"
// concept (Priority 2 in its own "Future product directions") - it has
// no owner field, no explicit scope, no evidence citations, no
// expiration/verification-method metadata, and no Dependency Graph
// linkage. It implements exactly three continuously re-evaluated,
// system-observed checks with real persisted history. See ADR-0055.

message GetLocalNetworkBridgeStatusRequest {
  string network_id = 1;
}

message GetLocalNetworkBridgeStatusResponse {
  // bridge_status is "up"/"down"/"unknown" - THIS node's own local view
  // only, from RaftClient.ListNetworksLocal + the local VLANStatus
  // interface. Never forwarded to a leader.
  string bridge_status = 1;

  // error is set for a network_id this node's local FSM doesn't
  // recognize (which may reflect replication lag, not a genuinely
  // absent network) or a local check failure. A caller MUST map this to
  // an unknown/unverified outcome, never a definitive false - see
  // internal/assumecheck.
  string error = 2;
}

enum AssumptionKind {
  ASSUMPTION_KIND_UNSPECIFIED = 0;

  // PEER_MANAGER_RPC_SUCCEEDED: a call to a peer's managerd completed at
  // all - reachability only, no claim about credentials.
  ASSUMPTION_KIND_PEER_MANAGER_RPC_SUCCEEDED = 1;

  // PEER_SECURITY_PATH_ACCEPTED: a call over this node's CURRENTLY
  // CONFIGURED local security path (TLS if -peer-tls, an API key if
  // -peer-api-key) was accepted by the peer. This does NOT prove the
  // peer validated or even enforces that path -
  // internal/manager/auth.go's checkAuth accepts every call, key or
  // not, until any API key has ever been created cluster-wide. Do not
  // rename this back to anything implying "verified" or
  // "authenticated" - see ADR-0055.
  ASSUMPTION_KIND_PEER_SECURITY_PATH_ACCEPTED = 2;

  ASSUMPTION_KIND_NAT_UPLINK_DEFAULT_ROUTE = 3;

  // REPLICA_BHYVE_CONFIGURED / REPLICA_NETWORK_BRIDGE_UP: VMs only -
  // JailDefinition has no bhyve concept and no network_id field in v1.
  ASSUMPTION_KIND_REPLICA_BHYVE_CONFIGURED = 4;
  ASSUMPTION_KIND_REPLICA_NETWORK_BRIDGE_UP = 5;
}

enum AssumptionStatus {
  ASSUMPTION_STATUS_UNSPECIFIED = 0;
  ASSUMPTION_STATUS_TRUE = 1;
  ASSUMPTION_STATUS_FALSE = 2;
  ASSUMPTION_STATUS_UNKNOWN = 3;

  // NOT_APPLICABLE: the check does not apply here at all (e.g. no NAT
  // uplink configured on this node) - this is NOT uncertainty, and must
  // never be conflated with UNKNOWN in observed_status. Still subject
  // to the same staleness collapse as every other status in
  // AssumptionResult.status below - applicability itself can silently
  // change if the checker stops running.
  ASSUMPTION_STATUS_NOT_APPLICABLE = 4;
}

enum AssumptionSubjectKind {
  ASSUMPTION_SUBJECT_KIND_UNSPECIFIED = 0;
  ASSUMPTION_SUBJECT_KIND_NODE = 1; // the local node itself (peer/NAT checks)
  ASSUMPTION_SUBJECT_KIND_VM = 2;
  ASSUMPTION_SUBJECT_KIND_JAIL = 3; // reserved for a future check - v1 never populates this
}

// AssumptionKey identifies one continuously-tracked assumption. Every
// field besides kind may legitimately be empty. subject_kind exists
// specifically so a VM and a jail sharing a literal id string can never
// collide under the same key - included now so this identity schema
// doesn't need a breaking migration once real history has accumulated.
message AssumptionKey {
  AssumptionKind kind = 1;
  AssumptionSubjectKind subject_kind = 6;
  string subject_id = 2;          // resource this check is ABOUT (e.g. a VM id); "" for node-level checks
  string dependency_id = 3;       // the thing depended on (peer node id, replica node id, uplink interface name)
  string qualifier = 4;           // kind-specific disambiguator (e.g. a network id); "" otherwise
  string observed_by_node_id = 5; // the raft node ID that performed this check - always local
}

// AssumptionResult is the CURRENT-SNAPSHOT view for one key (see
// `latest` below) - overwritten on every check tick, whether or not the
// value changed, so last_observed_at reflects genuine per-tick
// freshness.
message AssumptionResult {
  AssumptionKey key = 1;

  // observed_status is the raw, as-last-measured value - diagnostic
  // only, never the value a consumer should trust by default.
  AssumptionStatus observed_status = 2;

  // status is the EFFECTIVE status a consumer should trust by default -
  // computed server-side from observed_status + staleness. ANY stored
  // status, including NOT_APPLICABLE, collapses to UNKNOWN once stale;
  // applicability itself can silently change if the checker stops
  // running, so it gets no exemption. Never persisted this way - always
  // computed fresh at response time. This structural split (not a
  // `stale` flag alone) is what actually satisfies "stale evidence must
  // not silently count as true": a consumer reading only `status`
  // already gets a safe answer - see ADR-0055.
  AssumptionStatus status = 3;

  // reason_code is a small, stable vocabulary (e.g. "connection_refused",
  // "bridge_down", "uplink_not_configured") - see internal/assumecheck.
  // Detail is NEVER used for this purpose (free text is not stable
  // transition identity).
  string reason_code = 4;

  // detail is sanitized/length-capped human text for diagnosis only -
  // see internal/assumptions.ClampDetail.
  string detail = 5;

  // last_observed_at_unix comes from the SNAPSHOT, never the history
  // journal - genuine per-tick freshness, not throttled by the
  // heartbeat interval.
  int64 last_observed_at_unix = 6;

  // stale is informational, for UI treatment - `status` above already
  // safely reflects this, a consumer does not need to check `stale`
  // itself to be safe.
  bool stale = 7;
}

// AssumptionHistoryEntry is an immutable JOURNAL fact, written only on a
// (observed_status, reason_code) transition or a periodic heartbeat -
// no staleness/effective-status split, since it describes a specific
// past moment, not "what should I trust right now."
message AssumptionHistoryEntry {
  AssumptionKey key = 1;
  AssumptionStatus observed_status = 2;
  string reason_code = 3;
  string detail = 4;
  int64 recorded_at_unix = 5;
}

message ListAssumptionResultsRequest {
  // filter unset = latest for every known key. filter set (even with
  // empty sub-fields, which are legitimate) = additionally return
  // `history` for that exact key. proto3 `optional` presence-tracking
  // avoids conflating "no filter" with "a filter whose fields happen to
  // be empty."
  optional AssumptionKey filter = 1;
}

message ListAssumptionResultsResponse {
  repeated AssumptionResult latest = 1;
  repeated AssumptionHistoryEntry history = 2; // only populated when filter is set; exact-key match only in v1
  string error = 3;

  // storage_degraded is true if this node's assumptions store had to
  // quarantine a corrupt/unrecognized-schema file, or found one with
  // unsafe permissions - see internal/assumptions.Manager.Degraded.
  // This is recomputed on every read (self-clearing once an operator
  // removes the quarantined file), not a one-time latch.
  bool storage_degraded = 4;
  string storage_degraded_detail = 5;
}
