// APIKeyInfo is a key's metadata only - it never carries the raw key
// or its hash, so a hash can never leak back out over this API even
// by accident (see ADR-0023).
message APIKeyInfo {
  string id = 1;
  string name = 2;
  int64 created_unix = 3;

  // role is one of "admin"/"operator"/"viewer" (ADR-0030) - gates
  // which RPCs a caller presenting this key may invoke.
  string role = 4;
}

message CreateAPIKeyRequest {
  string name = 1;
  uint32 timeout_ms = 2;

  // role is one of "admin"/"operator"/"viewer" (ADR-0030); empty/
  // unrecognized is normalized to "viewer" (least privilege) - see
  // ApiKey.role's own doc comment in api/internalpb/state.proto.
  string role = 3;
}

message CreateAPIKeyResponse {
  APIKeyInfo key = 1;

  // raw_key is the actual credential, shown exactly once - it is
  // never stored anywhere (only its hash is) and can never be
  // retrieved again after this response.
  string raw_key = 2;

  string error = 3;
  string leader_hint = 4;
}

message ListAPIKeysRequest {}

message ListAPIKeysResponse {
  repeated APIKeyInfo keys = 1;
  string error = 2;
  string leader_hint = 3;
}

