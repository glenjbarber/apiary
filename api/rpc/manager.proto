syntax = "proto3";

package apiary.rpc.v1;

option go_package = "github.com/glenjbarber/apiary/api/rpc;rpcpb";

// ManagerService is the external RPC API exposed by managerd. It is
// deliberately diagnostic-only for v1: there is no bhyve/jail/zfs backend
// yet, so operations like CreateVM or MigrateVM have nothing real to do.
// Status proves the full external-client -> managerd -> raftd chain works.
service ManagerService {
  rpc Status(StatusRequest) returns (StatusResponse);
}

message StatusRequest {}

message StatusResponse {
  // manager_node_id identifies this managerd instance. It may differ from
  // the raft node ID it talks to.
  string manager_node_id = 1;

  // raft_reachable is false if managerd could not reach raftd over the
  // internal socket for this request; raft_error explains why, and the
  // remaining raft_* fields are left at their zero values.
  bool raft_reachable = 2;
  string raft_error = 3;

  bool raft_is_leader = 4;
  string raft_leader_id = 5;
  string raft_node_id = 6;
  uint64 raft_last_log_index = 7;
  uint64 raft_applied_index = 8;
  string raft_state = 9;
}
