# make.conf - paired with src.conf in this same directory for a minimal
# FreeBSD 16.0-CURRENT Apiary Comb build. src.conf controls WHICH
# components are built at all; this file controls HOW the ones that
# remain are built and installed. See src.conf's own header comment for
# the verification method and the architecture warning (amd64 fleet +
# one arm64 RPi4 Comb, "frame") - it applies here too.
#
# make.conf(5) covers world, kernel, docs, AND ports builds in one file.
# Apiary installs no ports/packages from source (dnsmasq, its one
# third-party runtime dependency, comes from the binary pkg repo via
# `pkg install`, per internal/install/checks.go) - so this file has
# nothing ports-specific in it on purpose, not by omission.

# --- Strip installed binaries and libraries --------------------------------
# Paired with src.conf's WITHOUT_DEBUG_FILES=yes: that knob stops
# separate .debug files from being generated/installed at all; STRIP
# additionally strips symbol tables from the binaries themselves.
# Together these are most of what WITHOUT_TOOLCHAIN's absence of a
# debugger (lldb, also cut in src.conf) would have wanted anyway - there
# is no on-Comb debugger left to consume symbols you kept.
STRIP=	-s

# --- Kernel build -----------------------------------------------------------
# GENERIC is left as KERNCONF deliberately - see the note in src.conf
# about kernel module trimming: this file does NOT attempt a
# MODULES_OVERRIDE/WITHOUT_MODULES whitelist, because the true minimum
# module set was only ever confirmed by reading `kldstat` on ONE live
# amd64 Comb (buzz.lab3.home.arpa, 2026-09-29): zfs, fdescfs, nmdm
# (bhyve serial console - internal/frontend's own VM serial-log page
# depends on this), if_bridge + bridgestp (Apiary's VM/jail networking
# model), pf + pflog, and geom_gate (loaded because hastd was running -
# HAST implements its replicated provider through the GEOM Gate kernel
# mechanism, confirmed live rather than assumed: `pkg which
# /boot/kernel/geom_gate.ko` shows it ships inside FreeBSD-kernel-generic
# itself, not as a separate toggleable package). vmm.ko (bhyve) was NOT
# in that list only because buzz had no VM running at the moment it was
# checked - it is still required. A handful of acpi_wmi/hidmap/hcons/
# hsctrl/ichsmb/smbus modules were also loaded, auto-matched by devd(8)
# to that specific motherboard's hardware, not to anything Apiary itself
# needs - excluding those by name would be safe on THIS machine and
# silently wrong on a different one. A real MODULES_OVERRIDE list needs
# kldstat confirmation on every distinct hardware platform in the fleet
# (including frame, the arm64 RPi4, whose module needs are completely
# different), which this session did not do - left as a follow-up
# rather than guessed at here.
KERNCONF=	GENERIC

# --- Reproducibility --------------------------------------------------------
# Worth turning on for anything you intend to actually ship as a
# versioned Comb image: two builds from the same source commit produce
# byte-identical output, which matters for the same reason
# internal/buildinfo's build-ID stamping (ADR from this repo's own
# September 2026 work) matters - "is the binary running on this Comb
# really what I think it is" is a question this project already takes
# seriously for its own Go binaries, and the same question applies to
# the base OS underneath them.
WITH_REPRODUCIBLE_BUILD=yes

# --- Left at defaults on purpose -------------------------------------------
# CPUTYPE is intentionally UNSET here, not tuned to e.g. "native" or a
# specific microarchitecture. This file has to build correctly for the
# whole fleet's real hardware mix (the amd64 boxes are not confirmed
# identical CPUs, and frame is arm64 entirely) - a CPUTYPE picked for
# one Comb's processor can produce a kernel/world that SIGILLs on
# another. If every amd64 Comb is later confirmed to share one
# microarchitecture, revisit this for that build only, never fleet-wide.
