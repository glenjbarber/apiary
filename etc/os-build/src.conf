# src.conf - minimal FreeBSD base build for an Apiary Comb
#
# Purpose: shrink a FreeBSD 16.0-CURRENT buildworld/buildkernel (and any
# release/ISO built from it) down to what a Comb actually runs, by
# excluding components at build time rather than deleting pkgbase
# packages after the fact. Excluding a component here means it is never
# compiled and never becomes an installable pkgbase package at all - a
# stronger guarantee than removing it post-install, where a later
# `pkg upgrade` or `freebsd-update` could reintroduce it.
#
# Verified against a live Comb (buzz.lab3.home.arpa, FreeBSD 16.0-CURRENT
# amd64, main-n288684-420428718da7) on 2026-09-29: every WITHOUT_ knob
# below was checked against `man src.conf` on that exact system (not
# assumed from a different FreeBSD version), and every "must keep"
# entry was checked against what Apiary's own Go source actually shells
# out to (`grep -r exec.Command` across internal/ and cmd/), not
# assumed from what a "typical minimal server" needs.
#
# ARCHITECTURE WARNING - read before using this file:
# Apiary's fleet is NOT single-architecture. brood/drone/buzz/sting/
# apiverse are amd64; frame is an arm64 Raspberry Pi 4. Several knobs
# below are annotated "amd64 only" or "do not set on arm64" - applying
# this file unmodified to an arm64/RPi4 build will silently produce a
# Comb that cannot boot (no device tree, no U-Boot loader) or has no
# bhyve (bhyve is amd64/arm64 only, but the specific arm64 board support
# below is what actually gets you to a kernel that boots on a Pi). If
# you are building one image for both architectures, either maintain
# two src.conf files, or drop this file's arm64-conditional knobs behind
# `.if ${TARGET_ARCH} == "amd64"` in a single shared file - see
# src.conf(5)'s own note that it is processed as a normal makefile.
#
# What this file deliberately does NOT do: disable anything Apiary's
# own binaries invoke, disable ZFS (WITHOUT_CDDL would - see below),
# disable anything security-hardening related (PIE/RELRO/SSP stay on),
# or disable rescue(8)/kernel debug symbols - see the note at the
# bottom for why those two are a judgment call this file leaves to you
# rather than making it for you.

# --- Must NOT be set - verified real runtime dependencies -----------------
# Apiary's own daemons (managerd/raftd/frontend/restshimd) shell out to
# these directly (grep -r 'exec.Command' internal/ cmd/, 2026-09-29):
#   zfs, zpool        -> internal/cluster (HAST/replication), internal/backup
#   jail, jexec, jls  -> internal/jail, internal/cluster
#   bhyve, bhyvectl   -> internal/bhyve
#   hastctl, hastd    -> internal/hast
#   pfctl             -> internal/pf
#   at                -> internal/deadman (the dead-man's-switch restart guard)
#   pw                -> internal/frontend/password.go (SetPassword)
#   pkg               -> internal/install (bootstraps dnsmasq, a THIRD-PARTY
#                        pkg Apiary's own DHCP server, internal/dhcpd, needs -
#                        pkg itself must survive even after this trims base)
#   ifconfig, route, netstat, sysctl, mount, umount, tar, sockstat, kldload
#                     -> various, all in FreeBSD-runtime/FreeBSD-utilities
#   sysrc             -> lives in FreeBSD-bsdconfig, NOT its own package -
#                        do not treat bsdconfig as installer-only cruft
#   smart             -> internal/hoststats/stats.go (disk health) - this
#                        one is invoked through a runCmd() wrapper, not a
#                        literal exec.Command() call, and was missed on
#                        the FIRST pass of this search; a second pass
#                        that found every runCmd/runCmdStdin wrapper
#                        across internal/ and re-grepped their literal
#                        command arguments is what caught it. Recorded
#                        here as a reason to re-run that same wrapper
#                        search on this file's next review, not just
#                        grep for exec.Command directly.
# Also required, not invoked directly but load-bearing:
#   PAM      - all web UI login (internal/pam)
#   OPENSSH  - the only remote admin access path to a Comb
#   CRYPT    - password hashing (pw/PAM depend on it)
#   CAROOT   - CA bundle; TLS peer verification and pkg's own HTTPS repo
#              access both need it
#   local_unbound - confirmed RUNNING live (see WITHOUT_UNBOUND below);
#              provides this Comb's own local DNS resolution today
# WITHOUT_BHYVE       # never - Apiary's whole VM story
# WITHOUT_JAIL        # never - Apiary's whole jail story
# WITHOUT_HAST        # never - internal/hast
# WITHOUT_PF          # never - internal/pf, Apiary's only firewall
# WITHOUT_ZFS         # never - zroot is Apiary's storage model
# WITHOUT_LOADER_ZFS  # never - Combs boot from a ZFS root
# WITHOUT_CDDL        # never - THIS CASCADES TO WITHOUT_ZFS/LOADER_ZFS too;
#                     # do not set it even "just for DTrace", see WITHOUT_DTRACE
#                     # below for the DTrace-only knob that does not cascade
# WITHOUT_AT          # never - internal/deadman
# WITHOUT_OPENSSH     # never - only remote admin path
# WITHOUT_PAM         # never - all login
# WITHOUT_PAM_SUPPORT # never
# WITHOUT_CRYPT       # never
# WITHOUT_CAROOT      # never
# WITHOUT_PKGBOOTSTRAP # never - dnsmasq install, pkgbase updates
# WITHOUT_PKGCONF     # never - pkg's own dependency resolver
# WITHOUT_BSDCONFIG   # not a real knob (bsdconfig has no WITHOUT_ toggle),
#                     # noted here only as a reminder it carries sysrc(8)
# WITHOUT_INET        # never - obviously
# WITHOUT_INET_SUPPORT # never
# WITHOUT_NETLINK     # do not set - ifconfig/route increasingly depend on
#                     # the netlink socket family in 16-CURRENT; verify
#                     # against a specific snapshot before ever touching this
# WITHOUT_ZONEINFO    # do not set - correct log timestamps depend on tzdata

# --- Toolchain and on-Comb build capability (safe: Apiary never compiles
#     anything on a deployed Comb - binaries are built centrally and
#     shipped via `apiaryctl install`; confirmed via grep, no cc/clang/
#     make/bmake invocation anywhere in internal/ or cmd/) -----------------
WITHOUT_TOOLCHAIN=yes		# implies CLANG/CLANG_BOOTSTRAP/CLANG_FULL, LLD,
				# LLD_BOOTSTRAP, LLDB, and more - the single
				# biggest win here: ~480 MiB on the live Comb
				# checked (pkg info -s across the set-devel
				# meta-package's own dependency list)
WITHOUT_CROSS_COMPILER=yes
WITHOUT_LLVM_TARGET_ALL=yes	# only relevant if WITHOUT_TOOLCHAIN is ever
				# reverted for one build; harmless either way
WITHOUT_GOOGLETEST=yes		# test framework, never runs on a Comb
WITHOUT_TESTS=yes		# do not build /usr/tests at all
WITHOUT_TESTS_SUPPORT=yes
# WITHOUT_MAKE is deliberately NOT set - bmake itself stays. Some rc.d
# and Apiary's own scripts assume a POSIX make exists for the base
# system; the cost is small once clang/lld above are gone, so there is
# no real reason to fight this one.
WITHOUT_DEBUG_FILES=yes		# strip .debug files from installed binaries;
				# pairs with make.conf's own STRIP setting
# WITHOUT_KERNEL_SYMBOLS and WITHOUT_RESCUE are deliberately NOT set -
# see the judgment-call note at the end of this file before setting
# either. Remember: src.conf(5) honors a WITH_/WITHOUT_ knob by its
# PRESENCE alone, not its value - writing "WITHOUT_RESCUE=no" would
# disable rescue(8) exactly as surely as "=yes" would. The only way to
# keep something in this file's vocabulary is to leave the line out
# entirely, which is why every "keep this" decision in this file is a
# comment, never a =no assignment - confirmed directly against a live
# bmake, not just assumed from the man page text (an earlier draft of
# this file used "=no" throughout and was wrong until this was checked).

# --- Legacy/unused network protocols and daemons (verified: Apiary uses
#     PF only for firewalling, dnsmasq for DHCP, its own Go RPC/HTTP for
#     everything else - none of these appear anywhere in internal/) -------
WITHOUT_IPFILTER=yes		# ipfilter - Apiary uses pf(4) exclusively
WITHOUT_IPFW=yes		# ipfw - same
WITHOUT_ROUTED=yes		# RIP routing daemon
WITHOUT_BOOTPARAMD=yes
WITHOUT_BOOTPD=yes		# legacy BOOTP - dnsmasq handles DHCP
WITHOUT_INETD=yes		# no inetd-launched service exists on a Comb
WITHOUT_NIS=yes			# NIS/YP - not used
WITHOUT_KERBEROS=yes		# Apiary auth is PAM, not Kerberos
WITHOUT_KERBEROS_SUPPORT=yes
WITHOUT_TCP_WRAPPERS=yes	# hosts.allow/deny - PF already does this job
WITHOUT_BLOCKLIST_SUPPORT=yes	# blocklistd integration in sshd etc.; PF's
				# own rules are Apiary's actual defense here
WITHOUT_AUTHPF=yes		# PF+SSH gateway feature, unrelated to how
				# Apiary drives pfctl itself
WITHOUT_RADIUS_SUPPORT=yes
WITHOUT_TFTP=yes
WITHOUT_FTP=yes			# base ftp(1) client - Apiary never fetches
				# anything via FTP
WITHOUT_TELNET=yes		# insecure legacy remote access
WITHOUT_TALK=yes
WITHOUT_FINGER=yes
WITHOUT_RBOOTD=yes
WITHOUT_AUTOFS=yes		# Apiary manages its own ZFS mounts directly
WITHOUT_LPR=yes			# line-printer spooling
# WITHOUT_UNBOUND is deliberately NOT set - checked live on
# buzz.lab3.home.arpa (2026-09-29): local_unbound is actually running
# (`service local_unbound status` -> running as pid 1712), providing
# this Comb's own local DNS resolution. An earlier draft of this file
# set this knob on the assumption that Combs only use "the network's
# own resolver" - that assumption was wrong, caught only by checking
# the live system instead of trusting it.
WITHOUT_LDNS_UTILS=yes		# drill/host - diagnostic-only; drop only if
				# you are comfortable without them when SSH'd
				# into a Comb mid-incident (see note below)

# --- Hardware support genuinely absent from this fleet (verified against
#     brood/drone/buzz/sting/apiverse being commodity amd64 servers with
#     no Bluetooth, no sound, no wifi, no exotic NICs; see the arch
#     warning at the top before applying to frame, the arm64 RPi4) --------
WITHOUT_BLUETOOTH=yes
WITHOUT_NETGRAPH=yes		# implies WITHOUT_BLUETOOTH too
WITHOUT_SOUND=yes
WITHOUT_WIRELESS=yes
WITHOUT_WIRELESS_SUPPORT=yes
WITHOUT_WPA_SUPPLICANT_EAPOL=yes
WITHOUT_GAMES=yes		# fortune(6), bcd(6), etc.
WITHOUT_CUSE=yes		# character-device-in-userspace framework,
				# unused
WITHOUT_APM=yes			# legacy laptop power management
WITHOUT_FLOPPY=yes
# WITHOUT_GPIO is deliberately NOT set - the arm64 RPi4 build (frame)
# may need GPIO; left unset (default = built) rather than guessing
# per-architecture in a single shared file.
WITHOUT_CXGBETOOL=yes		# Chelsio NIC tooling - no Chelsio hardware
WITHOUT_MLX5TOOL=yes		# Mellanox NIC tooling - none in this fleet
WITHOUT_HYPERV=yes		# Hyper-V guest integration - Combs are bhyve
				# HOSTS on bare metal, never Hyper-V guests
WITHOUT_OFED=yes		# InfiniBand/RDMA stack - no such hardware

# --- Documentation, examples, and locale data (verified: the web UI is
#     the only interface an operator uses day to day; nothing in Apiary
#     itself reads man pages, /usr/share/examples, or non-C locale data
#     at runtime) ----------------------------------------------------------
WITHOUT_MAN=yes
WITHOUT_MAN_UTILS=yes
WITHOUT_HTML=yes
WITHOUT_SHAREDOCS=yes
WITHOUT_EXAMPLES=yes
WITHOUT_LOCALES=yes		# C locale only; nothing in Apiary or the
				# base tools it calls localizes output
WITHOUT_NLS=yes
WITHOUT_NLS_CATALOGS=yes
# WITHOUT_LS_COLORS is deliberately NOT set - trivial size, real
# operator-diagnostic value over SSH, not worth cutting.

# --- Mail (verified: Apiary has no local-mail-delivery feature; periodic(8)
#     output and any future alerting is a Colony-wide notification concern -
#     ADR-0134 - not sendmail) ---------------------------------------------
WITHOUT_SENDMAIL=yes
WITHOUT_MAILWRAPPER=yes
WITHOUT_DMAGENT=yes		# dma, the lightweight sendmail replacement -
				# also unused; nothing local-delivers mail
# WITHOUT_MAIL is deliberately NOT set - mail(1), the MUA, is separate
# from the MTAs above and small; periodic(8)'s own output has somewhere
# to go without extra plumbing.

# --- Misc daemons/tools with no Apiary or OS-critical use -----------------
WITHOUT_ACCT=yes		# process accounting (accton/sa) - not used
WITHOUT_AUDIT=yes		# OpenBSM auditing - not used; if you later
				# want compliance-grade audit trails, this is
				# the knob to revert, not something to add
				# back piecemeal
WITHOUT_BSNMP=yes		# SNMP - the web UI/RPC API is the monitoring
				# surface today; revert this if SNMP polling
				# is ever added instead
WITHOUT_CALENDAR=yes		# calendar(1) reminder tool
WITHOUT_DICT=yes		# dict(1) protocol client
WITHOUT_QUOTAS=yes		# UFS/ZFS quota tools - Apiary does not use
				# per-user disk quotas anywhere
WITHOUT_PPP=yes			# dial-up/PPP - no such links in this fleet
WITHOUT_CCD=yes			# ccd(4) concatenated disk driver, superseded
				# by GEOM/ZFS, which Apiary actually uses
WITHOUT_ISCSI=yes		# Apiary's storage model is local ZFS + HAST,
				# never iSCSI
WITHOUT_DTRACE=yes		# NOT via WITHOUT_CDDL (see above) - this
				# standalone knob only cascades to
				# WITHOUT_CTF, leaving ZFS untouched; nothing
				# in Apiary uses dtrace at runtime
WITHOUT_LOCATE=yes		# locate(1) + its nightly database build
# WITHOUT_LEGACY_CONSOLE is deliberately NOT set - leave console/vt
# behavior at its default rather than fighting it for a marginal size
# gain on a machine you may need serial/KVM access to.

# --- Explicitly left ENABLED on purpose, not merely unconsidered ----------
# None of the following are set, on purpose - src.conf(5) honors a
# WITH_/WITHOUT_ knob by its PRESENCE alone, so the only way to keep
# something is to never write the line, never write it "=no" (see the
# WITHOUT_MAKE note near the top of this file for how that mistake was
# caught and fixed before this file was ever proposed to you):
#   WITHOUT_PIE           - keep Position-Independent Executables
#   WITHOUT_RELRO         - keep Relocation Read-Only hardening
#   WITHOUT_SSP           - keep stack-smashing protection
#   WITHOUT_ASSERT_DEBUG  - leave assert(3) checks in system libraries;
#                           an assertion firing during a ZFS/bhyve/PF
#                           operation is exactly the kind of "silent
#                           failure" this project's own evidence-first
#                           design (docs/web-ui-redesign.md Section 3.1)
#                           is built to distrust - not worth trading
#                           for a marginal binary-size win
#   WITHOUT_CASPER        - moot either way: the man page on this exact
#                           FreeBSD version says "this option has no
#                           effect" - listed here only so a future
#                           reader does not wonder why it is absent

# --- Judgment calls this file deliberately leaves to you ------------------
# WITHOUT_RESCUE and WITHOUT_KERNEL_SYMBOLS both trade real operability
# for size, on a project whose own stated design principle is that
# "state should be obvious" and silent gaps are the thing to distrust
# (docs/web-ui-redesign.md Section 3.1's whole "never confuse a gap with
# a good result" vocabulary). rescue(8) is the last statically-linked
# recovery shell when dynamic linking or /usr itself is broken; kernel
# symbols are what make a bhyve or ZFS kernel panic's backtrace legible
# instead of a bare hex dump. Neither costs much next to WITHOUT_TOOLCHAIN's
# ~480 MiB. Left at their defaults (both built) above; set
# WITHOUT_RESCUE=yes / WITHOUT_KERNEL_SYMBOLS=yes yourself if you have
# decided the size matters more than that recovery path for your image.
